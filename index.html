function appFiles(startPath = '/'){
  const { body } = createWindow({ title:'Files', icon:'files', width:820, height:540, appId:'files' });
  let cwd = startPath, selected = null;
  body.innerHTML = `
    <div class="pane">
      <div class="sidebar">
        <div class="side-item active" data-go="/">💻 This PC</div>
        <div class="side-item" data-go="/Desktop">🖥️ Desktop</div>
        <div class="side-item" data-go="/Documents">📄 Documents</div>
        <div class="side-item" data-go="/Pictures">🖼️ Pictures</div>
        <div class="side-item" data-go="/Music">🎵 Music</div>
        <div class="side-item" data-go="/Downloads">⬇️ Downloads</div>
        <div class="side-item" data-go="/Code">💻 Code</div>
      </div>
      <div class="main">
        <div class="toolbar">
          <button data-act="up">⬆ Up</button>
          <button data-act="newfolder">➕ Folder</button>
          <button data-act="newfile">📄 File</button>
          <button data-act="rename">✎ Rename</button>
          <button data-act="delete">🗑 Delete</button>
          <div class="path"></div>
        </div>
        <div class="grid"></div>
      </div>
    </div>`;
  const grid = body.querySelector('.grid');
  const pathEl = body.querySelector('.path');
  function render(){
    const node = getNode(cwd) || FS;
    pathEl.textContent = cwd; grid.innerHTML = '';
    const names = Object.keys(node.children || {}).sort((a,b) => {
      const A = node.children[a], B = node.children[b];
      if(A.type !== B.type) return A.type === 'dir' ? -1 : 1;
      return a.localeCompare(b);
    });
    if(!names.length){ grid.innerHTML = '<div class="empty">Empty folder</div>'; return; }
    names.forEach(name => {
      const n = node.children[name];
      const d = document.createElement('div');
      d.className = 'fitem';
      d.innerHTML = `${icoHTML(fileIco(name, n.type==='dir'), 38)}<div>${esc(name)}</div>`;
      d.onclick = e => { e.stopPropagation(); $$('.fitem', grid).forEach(x => x.classList.remove('sel')); d.classList.add('sel'); selected = name; };
      d.ondblclick = () => {
        const full = (cwd==='/'?'':cwd) + '/' + name;
        if(n.type==='dir'){ cwd = full; selected = null; render(); }
        else if(/\.(png|jpe?g|gif|webp|svg)$/i.test(name)) openApp('imageviewer', { path: full });
        else if(/\.(js|html|css|py|json|ts)$/i.test(name)) openApp('codeeditor', { path: full });
        else if(/\.md$/i.test(name)) openApp('markdown', { path: full });
        else openApp('notes', { path: full });
      };
      grid.appendChild(d);
    });
  }
  const requireSel = () => selected || (toast('No selection'), null);
  body.querySelector('.sidebar').onclick = e => {
    const it = e.target.closest('.side-item'); if(!it) return;
    $$('.side-item', body).forEach(x => x.classList.remove('active'));
    it.classList.add('active');
    cwd = it.dataset.go; selected = null; render();
  };
  body.querySelector('.toolbar').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const act = b.dataset.act, node = getNode(cwd);
    if(act === 'up'){ if(cwd!=='/'){ cwd = parentPath(cwd)||'/'; selected=null; render(); } return; }
    if(act === 'newfolder'){
      const name = uniqueName(cwd, prompt('Folder name:', 'New Folder') || '');
      if(!name) return;
      node.children[name] = { type:'dir', children:{} };
      saveFS(); render(); renderDesktop(); return;
    }
    if(act === 'newfile'){
      let name = prompt('File name:', 'untitled.txt'); if(!name) return;
      if(!name.includes('.')) name += '.txt';
      name = uniqueName(cwd, name);
      node.children[name] = { type:'file', content:'' };
      saveFS(); render(); renderDesktop(); return;
    }
    if(act === 'rename'){
      const s = requireSel(); if(!s) return;
      const nn = prompt('Rename to:', s); if(!nn || nn===s) return;
      node.children[nn] = node.children[s]; delete node.children[s];
      saveFS(); selected=null; render(); return;
    }
    if(act === 'delete'){
      const s = requireSel(); if(!s) return;
      if(!confirm('Delete "'+s+'"?')) return;
      delete node.children[s]; saveFS(); selected=null; render(); renderDesktop();
    }
  };
  grid.addEventListener('click', () => { selected = null; $$('.fitem', grid).forEach(x => x.classList.remove('sel')); });
  render();
}

/* NOTEPAD */
function appNotes(path){
  const name = path ? baseName(path) : 'Untitled.txt';
  const { body, id } = createWindow({ title:name, icon:'notes', width:680, height:480, appId:'notes' });
  const node = path ? getNode(path) : null;
  let currentPath = path || null;
  body.innerHTML = `
    <div class="np-wrap">
      <div class="toolbar">
        <button data-act="save">💾 Save</button>
        <button data-act="saveas">📁 Save As…</button>
        <div class="path">${esc(currentPath || 'unsaved')}</div>
      </div>
      <textarea class="np-ta" spellcheck="false"></textarea>
    </div>`;
  const ta = body.querySelector('.np-ta');
  ta.value = node ? node.content : '';
  function save(p){
    const dir = getNode(parentPath(p));
    if(!dir || dir.type !== 'dir'){ toast('Save failed'); return false; }
    dir.children[baseName(p)] = { type:'file', content: ta.value };
    saveFS(); currentPath = p;
    body.querySelector('.path').textContent = p;
    renderDesktop(); toast('Saved', baseName(p));
    return true;
  }
  body.querySelector('.toolbar').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.act === 'save'){
      if(!currentPath){ const n = prompt('Save as:', '/Documents/untitled.txt'); if(!n) return; save(n); }
      else save(currentPath);
    }
    if(b.dataset.act === 'saveas'){
      const n = prompt('Save as:', currentPath || '/Documents/untitled.txt'); if(!n) return;
      save(n);
    }
  };
  const timer = setInterval(() => {
    if(!openWindows.has(id)){ clearInterval(timer); return; }
    if(!currentPath) return;
    const dir = getNode(parentPath(currentPath));
    if(dir && dir.type === 'dir'){ dir.children[baseName(currentPath)] = { type:'file', content: ta.value }; saveFS(); }
  }, 2500);
}

/* CALC */
function appCalc(){
  const { body } = createWindow({ title:'Calculator', icon:'calc', width:350, height:490, appId:'calc' });
  let expr = '';
  const keys = ['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','( )','='];
  body.innerHTML = `<div class="calc"><div class="calc-disp">0</div><div class="calc-grid">${keys.map(k => { const op = ['÷','×','−','+','%','C','⌫'].includes(k); const eq = k === '='; return `<button class="${eq?'eq':op?'op':''}" data-k="${k}">${k}</button>`; }).join('')}</div></div>`;
  const disp = body.querySelector('.calc-disp');
  const draw = () => disp.textContent = expr || '0';
  function evaluate(raw){
    let s = raw.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');
    const open = (s.match(/\(/g)||[]).length, close = (s.match(/\)/g)||[]).length;
    s += ')'.repeat(Math.max(0, open-close));
    if(!/^[0-9+\-*/().\s]+$/.test(s)) throw new Error('bad');
    const v = Function('"use strict";return (' + s + ')')();
    if(!isFinite(v)) throw new Error('bad');
    return Math.round(v * 1e12) / 1e12;
  }
  body.querySelector('.calc-grid').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const k = b.dataset.k;
    if(k === 'C'){ expr = ''; draw(); return; }
    if(k === '⌫'){ expr = expr.slice(0,-1); draw(); return; }
    if(k === '='){
      try { expr = String(evaluate(expr)); } catch { expr = 'Error'; }
      draw(); return;
    }
    if(k === '( )'){
      const open = (expr.match(/\(/g)||[]).length, close = (expr.match(/\)/g)||[]).length;
      expr += open > close ? ')' : '('; draw(); return;
    }
    if(expr === 'Error') expr = '';
    expr += k; draw();
  };
  draw();
}

/* TERMINAL */
function appTerminal(){
  const { body } = createWindow({ title:'Terminal', icon:'terminal', width:720, height:470, appId:'terminal' });
  let cwd = '/';
  const history = []; let hIdx = -1;
  body.innerHTML = `<div class="term"><div class="term-out"></div><div class="term-line"><span id="ps1">/ $</span><input spellcheck="false" autocomplete="off"></div></div>`;
  const out = body.querySelector('.term-out');
  const inp = body.querySelector('input');
  const ps1 = body.querySelector('#ps1');
  const print = (t='') => { out.textContent += t + '\n'; out.scrollTop = out.scrollHeight; };
  const setPS = () => ps1.textContent = (cwd === '/' ? '/' : cwd) + ' $';
  print('Mid OS Terminal v1.1');
  print('Type "help" for commands.');
  print('');
  const CMDS = {
    help: () => print('help ls cd pwd cat mkdir touch rm open apps date whoami version mode clear'),
    pwd: () => print(cwd),
    whoami: () => print(currentUser ? currentUser.username : 'guest'),
    version: () => print('Mid OS v1.1'),
    date: () => print(new Date().toString()),
    clear: () => { out.textContent = ''; },
    mode: a => { const m = (a[0]||'').toLowerCase(); if(['desktop','tablet','mobile'].includes(m)){ applyViewMode(m); print('mode: ' + m); } else print('usage: mode <desktop|tablet|mobile>'); },
    apps: () => print(Object.keys(APPS).join('   ')),
    ls: a => {
      const p = a[0] ? resolvePath(cwd, a[0]) : cwd;
      const n = getNode(p);
      if(!n) return print('ls: no such dir');
      if(n.type === 'file') return print(baseName(p));
      const names = Object.keys(n.children || {});
      print(names.length ? names.join('\n') : '(empty)');
    },
    cd: a => { const p = a[0] ? resolvePath(cwd, a[0]) : '/'; const n = getNode(p); if(!n || n.type !== 'dir') return print('cd: no such dir'); cwd = p; setPS(); },
    cat: a => { if(!a[0]) return print('usage: cat <file>'); const n = getNode(resolvePath(cwd, a[0])); if(!n || n.type !== 'file') return print('cat: no such file'); print(n.content || '(empty)'); },
    mkdir: a => { if(!a[0]) return print('usage: mkdir <name>'); const d = getNode(cwd); const name = uniqueName(cwd, a[0]); d.children[name] = { type:'dir', children:{} }; saveFS(); renderDesktop(); print('created ' + name + '/'); },
    touch: a => { if(!a[0]) return print('usage: touch <name>'); const d = getNode(cwd); const name = uniqueName(cwd, a[0]); d.children[name] = { type:'file', content:'' }; saveFS(); renderDesktop(); print('created ' + name); },
    rm: a => { if(!a[0]) return print('usage: rm <name>'); const d = getNode(cwd); if(!d.children[a[0]]) return print('rm: no such item'); delete d.children[a[0]]; saveFS(); renderDesktop(); print('removed ' + a[0]); },
    open: a => { const k = (a[0]||'').toLowerCase(); if(APPS[k]){ openApp(k); print('launching ' + k + '…'); } else print('open: unknown "' + k + '"'); },
    reboot: () => { print('Rebooting…'); setTimeout(() => location.reload(), 700); }
  };
  inp.addEventListener('keydown', e => {
    if(e.key === 'ArrowUp'){ if(!history.length) return; hIdx = Math.max(0, hIdx - 1); inp.value = history[hIdx] || ''; e.preventDefault(); return; }
    if(e.key === 'ArrowDown'){ if(!history.length) return; hIdx = Math.min(history.length, hIdx + 1); inp.value = hIdx >= history.length ? '' : history[hIdx]; e.preventDefault(); return; }
    if(e.key !== 'Enter') return;
    const raw = inp.value.trim(); inp.value = '';
    print((cwd === '/' ? '/' : cwd) + ' $ ' + raw);
    if(!raw) return;
    history.push(raw); hIdx = history.length;
    const parts = raw.match(/"[^"]*"|\S+/g).map(s => s.replace(/^"|"$/g,''));
    const cmd = parts.shift().toLowerCase();
    if(CMDS[cmd]){ try { CMDS[cmd](parts); } catch(err){ print('error: ' + err.message); } }
    else print('midsh: command not found: ' + cmd);
    print('');
  });
  setTimeout(() => inp.focus(), 80);
  setPS();
}

  body.innerHTML = `
    <div class="br">
      <div class="br-toolbar">
        <button data-act="back">←</button>
        <button data-act="reload">↻</button>
        <button data-act="home">🏠</button>

        <button data-act="go">Go</button>

      </div>
      <div class="br-modes">
        <span style="color:#888">Mode:</span>
        <button data-mode="direct">🌐 Direct</button>
        <button data-mode="reader">📖 Reader</button>
        <div class="br-status" id="br-status"></div>
      </div>
      <div class="br-host" id="br-host"></div>
    </div>`;
  const host = body.querySelector('#br-host');
  const urlIn = body.querySelector('#br-url');
  const status = body.querySelector('#br-status');
  const backBtn = body.querySelector('[data-act="back"]');
  const KNOWN = [
    { name:'Wikipedia', url:'https://en.wikipedia.org/wiki/Operating_system', emoji:'📚' },
    { name:'DuckDuckGo', url:'https://lite.duckduckgo.com/lite/', emoji:'🦆' },
    { name:'Example.com', url:'https://example.com', emoji:'🧪' },
    { name:'MDN', url:'https://developer.mozilla.org', emoji:'📖' },
    { name:'HTTPBin', url:'https://httpbin.org/html', emoji:'🔧' },
    { name:'Hacker News', url:'https://news.ycombinator.com', emoji:'📰' },
    { name:'NPR Text', url:'https://text.npr.org', emoji:'📻' },
    { name:'Gutenberg', url:'https://www.gutenberg.org', emoji:'📖' },
    { name:'OpenStreetMap', url:'https://www.openstreetmap.org', emoji:'🗺️' },
    { name:'Archive.org', url:'https://archive.org', emoji:'🏛️' }
  ];
  let history = [], histIdx = -1;
  function setStatus(t, c){ status.textContent = t; status.style.color = c || ''; }
  function showHome(){
    setStatus('');
    host.innerHTML = `<div class="br-home"><h2>🌐 Browser</h2><p>Type a URL or search. Try a known-good site below.</p><div class="br-searchbar"><input id="br-search-in" placeholder="Search or enter URL…" spellcheck="false"><button id="br-search-go">Go</button></div><div class="br-quick">${KNOWN.map(s => `<div class="br-q" data-url="${esc(s.url)}"><span class="e">${s.emoji}</span>${esc(s.name)}</div>`).join('')}</div></div>`;
    urlIn.value = '';
    const si = host.querySelector('#br-search-in'), sb = host.querySelector('#br-search-go');
    const go = () => load(si.value);
    sb.onclick = go; si.onkeydown = e => { if(e.key === 'Enter') go(); };
    host.querySelectorAll('.br-q').forEach(q => q.onclick = () => load(q.dataset.url));
    setTimeout(() => si.focus(), 60);
  }
  function normalize(u){
    u = (u || '').trim(); if(!u) return '';
    if(!/^https?:\/\//i.test(u)){
      if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(u)) u = 'https://' + u;
      else u = 'https://duckduckgo.com/?q=' + encodeURIComponent(u);
    }
    return u;
  }
  function pushHistory(url){
    history = history.slice(0, histIdx + 1);
    history.push(url);
    histIdx = history.length - 1;
    backBtn.disabled = histIdx <= 0;
  }
  function load(rawUrl, fromHistory){
    const url = normalize(rawUrl);
    if(!url){ showHome(); return; }
    urlIn.value = url;
    if(!fromHistory) pushHistory(url);
    host.innerHTML = `<div class="br-loading"><div class="spinner"></div><div id="br-loading-text">Loading…</div></div>`;
    if(mode === 'reader') loadReader(url); else loadDirect(url);
  }
  function loadDirect(url){
    setStatus('Loading (Direct)…', '#f59e0b');
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.referrerPolicy = 'no-referrer';
    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads');
    let loaded = false;
    const timer = setTimeout(() => { if(!loaded) showBlocked(url); }, 6000);
    iframe.onload = () => { loaded = true; clearTimeout(timer); setStatus('Loaded', '#22c55e'); host.innerHTML = ''; host.appendChild(iframe); };
    iframe.onerror = () => { clearTimeout(timer); showBlocked(url); };
    host.appendChild(iframe);
  }
  async function loadReader(url){
    setStatus('Loading (Reader)…', '#f59e0b');
    const t = host.querySelector('#br-loading-text'); if(t) t.textContent = 'Fetching article text…';
    try{
      const res = await fetch('https://r.jina.ai/' + url, { headers: { 'Accept': 'text/plain' } });
      if(!res.ok) throw new Error('Fetch failed: ' + res.status);
      let text = await res.text();
      const titleMatch = text.match(/^Title:\s*(.+)$/m);
      const titleText = titleMatch ? titleMatch[1].trim() : url;
      const cs = text.indexOf('Markdown Content:');
      if(cs > -1) text = text.slice(cs + 'Markdown Content:'.length);
      host.innerHTML = `<div class="br-article"><h1>${esc(titleText)}</h1><div style="font-size:12px;color:#666;margin-bottom:20px">${esc(url)}</div>${markdownLite(text)}</div>`;
      setStatus('Reader mode', '#22c55e');
    }catch(err){ setStatus('Reader failed', '#ff5f57'); showBlocked(url, err.message); }
  }
  function markdownLite(md){
    let out = esc(md);
    out = out.replace(/^###### (.*)$/gm, '<h3>$1</h3>').replace(/^##### (.*)$/gm, '<h3>$1</h3>').replace(/^#### (.*)$/gm, '<h3>$1</h3>').replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    out = out.replace(/^> (.*)$/gm, '<blockquote>$1</blockquote>').replace(/^\s*[-*] (.*)$/gm, '<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)(?=\s*(?!<li>))/g, '<ul>$1</ul>');
    out = out.split(/\n{2,}/).map(p => /^\s*<(h[1-6]|ul|pre|blockquote|img)/.test(p) ? p : '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('\n');
    return out;
  }
  function showBlocked(url, detail){
    setStatus('Blocked', '#ff5f57');
    host.innerHTML = `<div class="br-blocked"><div class="emo">🔒</div><b style="font-size:16px;color:#fff">This site refused to load in an iframe</b><div style="max-width:560px;color:#999;font-size:12.5px;line-height:1.8">Big sites send <code>X-Frame-Options: DENY</code>. ${detail ? `<br><br><code>${esc(detail)}</code>` : ''}</div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px"><button class="btn primary" id="br-try-reader">📖 Try Reader mode</button><button class="btn" id="br-open-new">↗ Open in real tab</button><button class="btn" id="br-home">🏠 Back to Home</button></div></div>`;
    host.querySelector('#br-try-reader').onclick = () => { mode = 'reader'; uSet('browserMode', 'reader'); updateModeButtons(); load(url, true); };
    host.querySelector('#br-open-new').onclick = () => window.open(url, '_blank');
    host.querySelector('#br-home').onclick = showHome;
  }
  function updateModeButtons(){ body.querySelectorAll('.br-modes button[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode)); }
  body.querySelectorAll('.br-modes button[data-mode]').forEach(b => {
    b.onclick = () => { mode = b.dataset.mode; uSet('browserMode', mode); updateModeButtons(); if(urlIn.value) load(urlIn.value, true); else showHome(); };
  });
  updateModeButtons();
  body.querySelector('.br-toolbar').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const a = b.dataset.act;
    if(a === 'go') load(urlIn.value);
    if(a === 'reload'){ if(urlIn.value) load(urlIn.value, true); }
    if(a === 'home'){ history = []; histIdx = -1; backBtn.disabled = true; showHome(); }
    if(a === 'ext'){ const u = normalize(urlIn.value); if(u) window.open(u, '_blank'); }
    if(a === 'back'){ if(histIdx > 0){ histIdx--; load(history[histIdx], true); backBtn.disabled = histIdx <= 0; } }
  };
  urlIn.addEventListener('keydown', e => { if(e.key === 'Enter') load(urlIn.value); });
  backBtn.disabled = true;
  if(startUrl) load(startUrl); else showHome();
}

/* PAINT */
function appPaint(){
  const { body } = createWindow({ title:'Paint', icon:'paint', width:960, height:680, appId:'paint' });
  body.innerHTML = `
    <div class="paint">
      <div class="paint-tools">
        <button id="pt-undo">↶</button><button id="pt-redo">↷</button>
        <div class="divider"></div>
        <button id="pt-brush" class="on">🖌</button><button id="pt-eraser">🧽</button>
        <button id="pt-line">╱</button><button id="pt-rect">▭</button><button id="pt-fill">🪣</button>
        <div class="divider"></div>
        <input type="color" id="pt-col" value="#5b8cff">
        <div class="paint-swatches" id="pt-swatches"></div>
        <div class="divider"></div>
        <span style="font-size:11px;color:#aaa">Size</span>
        <input type="range" id="pt-size" min="1" max="80" value="6">
        <span id="pt-sizev" style="font-size:12px;color:#bbb;min-width:36px">6px</span>
        <div class="divider"></div>
        <button id="pt-clear">🗑</button><button id="pt-save">💾</button><button id="pt-download">⬇</button>
      </div>
      <div class="paint-canvas" id="pt-wrap"><canvas id="pt-cv"></canvas></div>
      <div class="paint-status"><span id="pt-info">Ready</span><span id="pt-pos">0, 0</span></div>
    </div>`;
  const cv = body.querySelector('#pt-cv');
  const wrap = body.querySelector('#pt-wrap');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  let tool = 'brush', drawing = false;
  let startX = 0, startY = 0, beforeSnapshot = null;
  let history = [], redoStack = [], initialized = false;
  const SWATCHES = ['#000','#fff','#ef4444','#f59e0b','#22c55e','#06b6d4','#5b8cff','#a05bff','#ff5b8c','#9ca3af'];
  const swWrap = body.querySelector('#pt-swatches');
  SWATCHES.forEach((c, i) => {
    const s = document.createElement('div');
    s.className = 'paint-sw' + (i === 6 ? ' active' : '');
    s.style.background = c;
    s.onclick = () => { body.querySelector('#pt-col').value = c; body.querySelectorAll('.paint-sw').forEach(x => x.classList.remove('active')); s.classList.add('active'); };
    swWrap.appendChild(s);
  });
  function fit(){
    const r = wrap.getBoundingClientRect();
    const w = Math.max(280, Math.floor(r.width));
    const h = Math.max(180, Math.floor(r.height));
    if(cv.width === w && cv.height === h && initialized) return;
    let prev = null;
    if(initialized){ prev = document.createElement('canvas'); prev.width = cv.width; prev.height = cv.height; prev.getContext('2d').drawImage(cv, 0, 0); }
    cv.width = w; cv.height = h;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    if(prev){ try { ctx.drawImage(prev, 0, 0); } catch(e){} }
    initialized = true;
  }
  requestAnimationFrame(() => fit());
  setTimeout(() => fit(), 120);
  new ResizeObserver(() => setTimeout(() => fit(), 90)).observe(wrap);
  function pushHistory(){ history.push(cv.toDataURL('image/png')); if(history.length > 30) history.shift(); redoStack = []; updateBtns(); }
  function updateBtns(){ body.querySelector('#pt-undo').style.opacity = history.length > 0 ? '1' : '.4'; body.querySelector('#pt-redo').style.opacity = redoStack.length > 0 ? '1' : '.4'; }
  function undo(){ if(!history.length) return; redoStack.push(cv.toDataURL('image/png')); loadSnapshot(history.pop()); updateBtns(); }
  function redo(){ if(!redoStack.length) return; history.push(cv.toDataURL('image/png')); loadSnapshot(redoStack.pop()); updateBtns(); }
  function loadSnapshot(dataUrl){ const img = new Image(); img.onload = () => { ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0); }; img.src = dataUrl; }
  updateBtns();
  function getPos(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) }; }
  const col = () => body.querySelector('#pt-col').value;
  const size = () => +body.querySelector('#pt-size').value;
  function hexToRgb(h){ h = h.replace('#',''); if(h.length === 3) h = h.split('').map(c => c+c).join(''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  function strokeOpts(){ ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = tool === 'eraser' ? size() * 2.4 : size(); ctx.strokeStyle = tool === 'eraser' ? '#fff' : col(); ctx.fillStyle = tool === 'eraser' ? '#fff' : col(); }
  function floodFill(x, y, hex){
    x = Math.round(x); y = Math.round(y);
    if(x < 0 || y < 0 || x >= cv.width || y >= cv.height) return;
    const img = ctx.getImageData(0, 0, cv.width, cv.height);
    const data = img.data, W = cv.width, H = cv.height;
    const startIdx = (y * W + x) * 4;
    const target = [data[startIdx], data[startIdx+1], data[startIdx+2], data[startIdx+3]];
    const [fr, fg, fb] = hexToRgb(hex);
    const fill = [fr, fg, fb, 255];
    if(target[0] === fill[0] && target[1] === fill[1] && target[2] === fill[2] && target[3] === fill[3]) return;
    const tol = 32;
    const match = i => Math.abs(data[i]-target[0]) < tol && Math.abs(data[i+1]-target[1]) < tol && Math.abs(data[i+2]-target[2]) < tol && Math.abs(data[i+3]-target[3]) < tol;
    const visited = new Uint8Array(W * H);
    const stack = [[x, y]];
    while(stack.length){
      const [cx, cy] = stack.pop();
      if(cx < 0 || cy < 0 || cx >= W || cy >= H) continue;
      const vidx = cy * W + cx;
      if(visited[vidx]) continue;
      visited[vidx] = 1;
      const i = vidx * 4;
      if(!match(i)) continue;
      data[i] = fill[0]; data[i+1] = fill[1]; data[i+2] = fill[2]; data[i+3] = 255;
      stack.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
    }
    ctx.putImageData(img, 0, 0);
  }
  cv.addEventListener('mousedown', e => {
    if(!initialized) fit();
    drawing = true;
    const p = getPos(e); startX = p.x; startY = p.y;
    pushHistory();
    if(tool === 'fill'){ floodFill(p.x, p.y, col()); drawing = false; return; }
    if(tool === 'line' || tool === 'rect'){ beforeSnapshot = ctx.getImageData(0, 0, cv.width, cv.height); return; }
    strokeOpts(); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.01, p.y + 0.01); ctx.stroke();
  });
  function onMove(e){
    const p = getPos(e);
    body.querySelector('#pt-pos').textContent = Math.round(p.x) + ', ' + Math.round(p.y);
    if(!drawing) return;
    if(tool === 'line'){ ctx.putImageData(beforeSnapshot, 0, 0); strokeOpts(); ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(p.x, p.y); ctx.stroke(); return; }
    if(tool === 'rect'){ ctx.putImageData(beforeSnapshot, 0, 0); strokeOpts(); ctx.strokeRect(startX, startY, p.x - startX, p.y - startY); return; }
    strokeOpts(); ctx.lineTo(p.x, p.y); ctx.stroke();
  }
  function onUp(){ drawing = false; beforeSnapshot = null; }
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mouseup', onUp);
  cv.addEventListener('mouseleave', onUp);
  document.addEventListener('mousemove', e => { if(drawing && !cv.contains(e.target)) onMove(e); });
  document.addEventListener('mouseup', onUp);
  cv.addEventListener('touchstart', e => { if(e.touches.length !== 1) return; e.preventDefault(); const t = e.touches[0]; cv.dispatchEvent(new MouseEvent('mousedown', {clientX: t.clientX, clientY: t.clientY})); }, {passive:false});
  cv.addEventListener('touchmove', e => { if(e.touches.length !== 1) return; e.preventDefault(); onMove({clientX: e.touches[0].clientX, clientY: e.touches[0].clientY}); }, {passive:false});
  cv.addEventListener('touchend', e => { e.preventDefault(); onUp(); });
  const setTool = t => { tool = t; ['brush','eraser','line','rect','fill'].forEach(x => body.querySelector('#pt-' + x).classList.toggle('on', x === t)); cv.style.cursor = t === 'fill' ? 'cell' : 'crosshair'; };
  ['brush','eraser','line','rect','fill'].forEach(t => body.querySelector('#pt-' + t).onclick = () => setTool(t));
  body.querySelector('#pt-size').oninput = e => body.querySelector('#pt-sizev').textContent = e.target.value + 'px';
  body.querySelector('#pt-undo').onclick = undo;
  body.querySelector('#pt-redo').onclick = redo;
  body.querySelector('#pt-clear').onclick = () => { if(!confirm('Clear?')) return; pushHistory(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); };
  body.querySelector('#pt-save').onclick = () => { const data = cv.toDataURL('image/png'); const name = 'painting-' + Date.now().toString(36) + '.png'; const pics = getNode('/Pictures'); if(pics){ pics.children[name] = { type:'file', content: data }; saveFS(); renderDesktop(); toast('Saved', '/Pictures/' + name); } };
  body.querySelector('#pt-download').onclick = () => { const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = 'painting.png'; a.click(); };
  document.addEventListener('keydown', e => {
    const w = [...openWindows.values()].find(x => x.appId === 'paint'); if(!w) return;
    if(e.ctrlKey && e.key.toLowerCase() === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
    if((e.ctrlKey && e.key.toLowerCase() === 'y') || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'z')){ e.preventDefault(); redo(); }
  });
  setTool('brush');
}

/* MUSIC */
function appMusic(){
  const { body, id: winId } = createWindow({ title:'Music', icon:'music', width:600, height:640, appId:'music' });
  body.innerHTML = `<div class="music"><div class="mplayer"><div class="m-cover" id="m-cover">${icoHTML('music', 110)}</div><div class="m-title" id="m-title">No track loaded</div><div class="m-sub" id="m-sub">Upload audio files to begin</div><div class="m-progress"><input type="range" id="m-seek" min="0" max="1000" value="0"><div class="m-times"><span id="m-cur">0:00</span><span id="m-dur">0:00</span></div></div><div class="m-controls"><button id="m-play">▶</button></div><div class="m-btns"><input type="file" id="m-files" accept="audio/*" multiple style="display:none"><button class="btn primary" id="m-upbtn">📁 Upload</button><button class="btn" id="m-clear">🗑 Clear</button></div><div class="m-list" id="m-list"></div></div></div>`;
  const audio = document.createElement('audio'); audio.preload = 'metadata';
  onWindowClose(winId, () => { audio.pause(); audio.src = ''; audio.load(); });
  const titleEl = body.querySelector('#m-title');
  const subEl = body.querySelector('#m-sub');
  const coverEl = body.querySelector('#m-cover');
  const seekEl = body.querySelector('#m-seek');
  const curEl = body.querySelector('#m-cur');
  const durEl = body.querySelector('#m-dur');
  const playBtn = body.querySelector('#m-play');
  const listEl = body.querySelector('#m-list');
  let playlist = [], current = -1;
  const fmt = s => { if(!isFinite(s)) return '0:00'; const m = Math.floor(s/60), sec = Math.floor(s%60); return m + ':' + String(sec).padStart(2,'0'); };
  async function loadLibrary(){
    if(!musicDB) return;
    const tracks = await dbAll();
    playlist = tracks.map(t => ({ id: t.id, name: t.name, url: URL.createObjectURL(t.blob) }));
    renderList();
    if(current < 0 && playlist.length) loadTrack(0);
  }
  function renderList(){
    if(!playlist.length){ listEl.innerHTML = '<div style="color:#666;font-size:12.5px;text-align:center;padding:12px">No music yet.</div>'; return; }
    listEl.innerHTML = playlist.map((t, i) => `<div class="m-track ${i===current?'active':''}" data-i="${i}"><div class="grow">${esc(t.name)}</div><span class="x" data-x="${i}">✕</span></div>`).join('');
    listEl.querySelectorAll('.m-track').forEach(el => el.onclick = e => { if(e.target.dataset.x !== undefined) return; playIndex(+el.dataset.i); });
    listEl.querySelectorAll('.x').forEach(x => x.onclick = async e => {
      e.stopPropagation();
      const i = +x.dataset.x;
      if(playlist[i].id) try { await dbDelete(playlist[i].id); } catch(err){}
      URL.revokeObjectURL(playlist[i].url);
      playlist.splice(i, 1);
      if(i === current){ audio.pause(); current = -1; loadTrack(-1); }
      renderList();
    });
  }
  function loadTrack(i){
    current = i; renderList();
    if(i < 0 || i >= playlist.length){ titleEl.textContent = 'No track'; subEl.textContent = 'Upload audio'; coverEl.classList.remove('spin'); playBtn.textContent = '▶'; return; }
    titleEl.textContent = playlist[i].name;
    audio.src = playlist[i].url; audio.load();
  }
  function playIndex(i){ if(i < 0 || i >= playlist.length) return; if(i !== current) loadTrack(i); audio.play().then(() => { playBtn.textContent = '⏸'; coverEl.classList.add('spin'); }).catch(() => {}); }
  playBtn.onclick = () => {
    if(!playlist.length){ body.querySelector('#m-upbtn').click(); return; }
    if(current < 0) loadTrack(0);
    if(audio.paused) playIndex(current);
    else { audio.pause(); playBtn.textContent = '▶'; coverEl.classList.remove('spin'); }
  };
  body.querySelector('#m-upbtn').onclick = () => body.querySelector('#m-files').click();
  body.querySelector('#m-clear').onclick = async () => {
    if(!confirm('Remove all?')) return;
    audio.pause();
    for(const t of playlist){ if(t.id) try { await dbDelete(t.id); } catch(e){} URL.revokeObjectURL(t.url); }
    playlist = []; current = -1; loadTrack(-1); renderList();
  };
  body.querySelector('#m-files').onchange = async e => {
    const files = [...e.target.files].filter(f => f.type.startsWith('audio/'));
    e.target.value = '';
    for(const f of files){
      try { const id = await dbAdd(f); playlist.push({ id, name: f.name, url: URL.createObjectURL(f) }); }
      catch(err){ playlist.push({ name: f.name, url: URL.createObjectURL(f) }); }
    }
    renderList();
    if(current < 0) loadTrack(0);
  };
  audio.onloadedmetadata = () => durEl.textContent = fmt(audio.duration);
  audio.ontimeupdate = () => { curEl.textContent = fmt(audio.currentTime); if(audio.duration) seekEl.value = Math.round((audio.currentTime / audio.duration) * 1000); };
  audio.onended = () => { if(current < playlist.length - 1) playIndex(current + 1); else playBtn.textContent = '▶'; };
  seekEl.onchange = () => { if(audio.duration) audio.currentTime = (seekEl.value / 1000) * audio.duration; };
  loadLibrary();
}

function appWeather(){

  async function load(lat, lon, city){

    try{
      const data = await fetchRealWeather(lat, lon);
      const cur = data.current;

      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      $('#w-now').style.display = 'flex';

      $('#w-fw').style.display = 'block';

        const d = new Date(t);

        return `<div class="w-day"><div class="dn">${i === 0 ? 'Today' : days[d.getDay()]}</div><div class="di">${di.emoji}</div><div class="dt">${Math.round(daily.temperature_2m_max[i])}°</div><div class="dl">${Math.round(daily.temperature_2m_min[i])}°</div></div>`;
      }).join('');
      $('#w-dw').style.display = 'block';

        <div class="w-det"><div class="l">UV</div><div class="v">${cur.uv_index ?? '—'}</div></div>
        <div class="w-det"><div class="l">Pressure</div><div class="v">${Math.round(cur.pressure_msl)} hPa</div></div>`;
      $('#w-status').textContent = '✓ Live from Open-Meteo';
      $('#w-status').style.color = '#22c55e';
    }catch(err){ $('#w-status').textContent = 'Error: ' + err.message; $('#w-status').style.color = '#ff5f57'; }
  }
  $('#w-go').onclick = async () => {
    const q = $('#w-city').value.trim(); if(!q) return;
    $('#w-status').textContent = 'Searching…';
    try{
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1`);
      const j = await r.json();

/* CALENDAR */
function appCalendar(){
  const { body } = createWindow({ title:'Calendar', icon:'calendar', width:640, height:620, appId:'calendar' });
  const today = new Date();
  let viewYear = today.getFullYear(), viewMonth = today.getMonth();
  let selectedDay = null;
  let events = uGet('events', {});
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const key = (y, m, d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  body.innerHTML = `<div class="cal"><div class="cal-head"><button id="cal-prev">‹</button><h3 id="cal-title"></h3><button id="cal-next">›</button></div><div class="cal-days">${DAYS.map(d => `<div class="cal-day-name">${d}</div>`).join('')}</div><div class="cal-grid" id="cal-grid"></div><div class="cal-evpanel" id="cal-panel"></div></div>`;
  function render(){
    body.querySelector('#cal-title').textContent = MONTHS[viewMonth] + ' ' + viewYear;
    const grid = body.querySelector('#cal-grid'); grid.innerHTML = '';
    const first = new Date(viewYear, viewMonth, 1).getDay();
    const total = new Date(viewYear, viewMonth + 1, 0).getDate();
    for(let i = 0; i < first; i++) grid.innerHTML += '<div class="cal-cell other"></div>';
    for(let d = 1; d <= total; d++){
      const c = document.createElement('div');
      c.className = 'cal-cell';
      if(viewYear === today.getFullYear() && viewMonth === today.getMonth() && d === today.getDate()) c.classList.add('today');
      if(selectedDay === d) c.classList.add('sel');
      const k = key(viewYear, viewMonth, d);
      const evs = events[k] || [];
      c.innerHTML = `<div>${d}</div>${evs.length ? `<div class="evs">${evs.slice(0,3).map(()=>'<i></i>').join('')}</div>` : ''}`;
      c.onclick = () => { selectedDay = d; render(); renderPanel(); };
      grid.appendChild(c);
    }
  }
  function renderPanel(){
    const panel = body.querySelector('#cal-panel');
    if(selectedDay === null){ panel.innerHTML = '<div style="color:#666;font-size:12.5px">Select a day</div>'; return; }
    const k = key(viewYear, viewMonth, selectedDay);
    const evs = events[k] || [];
    panel.innerHTML = `<h4>${MONTHS[viewMonth]} ${selectedDay}</h4>${evs.map((e, i) => `<div class="cal-ev"><div class="grow">${esc(e)}</div><button data-i="${i}">✕</button></div>`).join('')}<div class="cal-add"><input id="cal-new" placeholder="New event"><button id="cal-add-btn">Add</button></div>`;
    panel.querySelector('#cal-add-btn').onclick = () => {
      const v = panel.querySelector('#cal-new').value.trim(); if(!v) return;
      events[k] = events[k] || []; events[k].push(v);
      uSet('events', events); renderPanel(); render();
    };
    panel.querySelectorAll('button[data-i]').forEach(b => {
      b.onclick = () => { events[k].splice(+b.dataset.i, 1); uSet('events', events); renderPanel(); render(); };
    });
  }
  body.querySelector('#cal-prev').onclick = () => { viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; } selectedDay = null; render(); renderPanel(); };
  body.querySelector('#cal-next').onclick = () => { viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; } selectedDay = null; render(); renderPanel(); };
  render(); renderPanel();
}

/* MARKDOWN */
function appMarkdown(path){
  const { body } = createWindow({ title:'Markdown', icon:'markdown', width:900, height:600, appId:'markdown' });
  const node = path ? getNode(path) : null;
  let currentPath = path || null;
  body.innerHTML = `<div class="md"><div class="md-bar"><button data-v="split" class="on">Split</button><button data-v="edit">Edit</button><button data-v="preview">Preview</button><span style="flex:1"></span><button id="md-save">💾 Save</button></div><div class="md-split"><textarea class="md-src" id="md-src" spellcheck="false">${node ? esc(node.content) : '# Hello\n\nType **markdown** here.'}</textarea><div class="md-prev" id="md-prev"></div></div></div>`;
  const src = body.querySelector('#md-src');
  const prev = body.querySelector('#md-prev');
  function render(){
    let html = src.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/^> (.*)$/gm, '<blockquote>$1</blockquote>');
    html = html.split(/\n{2,}/).map(p => /^\s*<(h[1-6]|blockquote)/.test(p) ? p : '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('\n');
    prev.innerHTML = html;
  }
  src.addEventListener('input', render); render();
  body.querySelectorAll('.md-bar button[data-v]').forEach(b => {
    b.onclick = () => {
      body.querySelectorAll('.md-bar button[data-v]').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      const v = b.dataset.v;
      src.style.display = v === 'preview' ? 'none' : '';
      prev.style.display = v === 'edit' ? 'none' : '';
    };
  });
  body.querySelector('#md-save').onclick = () => {
    let p = currentPath || prompt('Save as:', '/Documents/untitled.md');
    if(!p) return;
    if(!p.endsWith('.md')) p += '.md';
    const dir = getNode(parentPath(p));
    if(!dir || dir.type !== 'dir') return;
    dir.children[baseName(p)] = { type:'file', content: src.value };
    saveFS(); currentPath = p; renderDesktop(); toast('Saved');
  };
}

/* IMAGE VIEWER */
function appImageViewer(startPath){
  const { body } = createWindow({ title:'Images', icon:'imageviewer', width:800, height:600, appId:'imageviewer' });
  let images = [], currentIdx = 0;
  function collect(){
    const r = [];
    (function walk(n, p){
      for(const k in (n.children||{})){
        const c = n.children[k], f = p + '/' + k;
        if(c.type === 'dir') walk(c, f);
        else if(/\.(png|jpe?g|gif|webp|svg)$/i.test(k)) r.push({ name:k, path:f, data:c.content });
      }
    })(FS, '');
    return r;
  }
  body.innerHTML = `<div class="imgv"><div class="imgv-bar"><button id="iv-prev">← Prev</button><button id="iv-next">Next →</button><div class="path" id="iv-path">-</div></div><div class="imgv-main" id="iv-main"></div></div>`;
  function render(){
    images = collect();
    const main = body.querySelector('#iv-main');
    if(!images.length){ main.innerHTML = '<div style="color:#555">No images found.</div>'; return; }
    if(currentIdx >= images.length) currentIdx = 0;
    if(currentIdx < 0) currentIdx = images.length - 1;
    main.innerHTML = `<img src="${esc(images[currentIdx].data)}">`;
    body.querySelector('#iv-path').textContent = images[currentIdx].path;
  }
  body.querySelector('#iv-prev').onclick = () => { currentIdx--; render(); };
  body.querySelector('#iv-next').onclick = () => { currentIdx++; render(); };
  if(startPath) setTimeout(() => { const i = images.findIndex(im => im.path === startPath); if(i >= 0){ currentIdx = i; render(); } }, 20);
  render();
}

/* CHAT */
function appChat(){
  const { body } = createWindow({ title:'Midnight AI', icon:'chat', width:560, height:640, appId:'chat' });
  let messages = uGet('chatMessages', [{ who:'them', text:'Midnight AI ready. Ask me anything.', time: Date.now() }]);
  const save = () => uSet('chatMessages', messages);
  body.innerHTML = `<div class="chat"><div class="chat-head"><div class="av">🌙</div><div style="flex:1"><h3>Midnight AI</h3><p>Online</p></div><button class="btn" id="ch-clear">Clear</button></div><div class="chat-body" id="ch-body"></div><div class="chat-input"><input id="ch-in" placeholder="Ask anything…" maxlength="400"><button id="ch-send">➤</button></div></div>`;
  const chatBody = body.querySelector('#ch-body');
  const inp = body.querySelector('#ch-in');
  function render(){
    chatBody.innerHTML = messages.map(m => `<div class="msg ${m.who}">${esc(m.text)}<span class="time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div>`).join('');
    chatBody.scrollTop = chatBody.scrollHeight;
  }
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  async function brain(raw){
    const lc = raw.trim().toLowerCase();
    if(/^(hi|hey|hello|yo)\b/i.test(lc)) return 'Hello!';
    if(/\b(who are you|your name)\b/i.test(lc)) return 'I am Midnight AI.';
    if(/\b(time|clock)\b/i.test(lc)){ const d = new Date(); const h12 = ((d.getHours() + 11) % 12) + 1; return `It is ${h12}:${String(d.getMinutes()).padStart(2,'0')} ${d.getHours() < 12 ? 'AM' : 'PM'}.`; }
    if(/\b(date|day|today)\b/i.test(lc)) return `Today is ${new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' })}.`;
    if(/\bweather\b/i.test(lc)){ try{ const c = getStoredCoords(); const data = await fetchRealWeather(c.lat, c.lon); return `${c.city}: ${Math.round(data.current.temperature_2m)}°C, wind ${Math.round(data.current.wind_speed_10m)} km/h.`; }catch(e){ return 'Weather unavailable.'; } }
    const mathMatch = lc.match(/^(?:calc(?:ulate)?|what(?:'s| is))?\s*([0-9][0-9+\-*/%.()\s]*[0-9)])\s*$/i);
    if(mathMatch){ try{ const expr = mathMatch[1].replace(/[^0-9+\-*/().\s]/g,''); if(/[+\-*/]/.test(expr)){ const v = Function('"use strict";return (' + expr + ')')(); if(isFinite(v)) return `${expr.trim()} = ${Math.round(v * 1e10) / 1e10}`; } }catch(e){} }
    if(/\bjoke\b/i.test(lc)) return pick(['Why do programmers prefer dark mode? Because light attracts bugs. 🐛', 'There are 10 types of people: those who understand binary and those who do not.']);
    if(/\bfact\b/i.test(lc)) return pick(['Honey never spoils. 🍯', 'Octopuses have three hearts. 🐙']);
    const openMatch = lc.match(/^(?:open|launch|start)\s+([a-z0-9 ]+)$/i);
    if(openMatch){ const t = openMatch[1].trim().replace(/\s+/g,''); if(APPS[t]){ openApp(t); return `Opening ${APPS[t].name}.`; } return `I don't know "${t}".`; }
    if(/\bthanks\b/i.test(lc)) return 'You are welcome!';
    return pick(['Interesting.', 'Got it.', 'Try asking for a joke, fact, time, or to open an app.']);
  }
  async function send(){
    const text = inp.value.trim(); if(!text) return;
    messages.push({ who:'me', text, time: Date.now() });
    inp.value = ''; save(); render();
    const reply = await brain(text);
    setTimeout(() => { messages.push({ who:'them', text: reply, time: Date.now() }); save(); render(); }, 400);
  }
  body.querySelector('#ch-send').onclick = send;
  inp.onkeydown = e => { if(e.key === 'Enter') send(); };
  body.querySelector('#ch-clear').onclick = () => { messages = []; save(); render(); };
  render();
}

/* SNAKE */
function appSnake(){
  const { body, id } = createWindow({ title:'Snake', icon:'snake', width:560, height:680, appId:'snake' });
  const CELL = 22, COLS = 20, ROWS = 20, SIZE = CELL * COLS;
  let speedSetting = uGet('snakeSpeed', 115);
  let wallMode = uGet('snakeWall', false);
  body.innerHTML = `<div class="game-wrap"><div class="game-hud"><span>Score <b id="s-score">0</b></span><span>Best <b id="s-best">0</b></span><button id="s-restart">🔄 New</button><button id="s-pause">⏸ Pause</button></div><canvas id="s-cv" width="${SIZE}" height="${SIZE}" class="snake-cv"></canvas><div class="game-hud" style="font-size:12px;color:#888"><label>Speed <select id="s-speed" style="background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:#ddd;padding:4px;border-radius:6px"><option value="160">Slow</option><option value="115">Normal</option><option value="80">Fast</option><option value="55">Insane</option></select></label><label><input type="checkbox" id="s-wall" ${wallMode?'checked':''}> Wrap</label></div></div>`;
  body.querySelector('#s-speed').value = String(speedSetting);
  const cv = body.querySelector('#s-cv'), ctx = cv.getContext('2d');
  let snake, dir, nextDir, food, score, over, paused, lastTick, acc, speed;
  let best = uGet('snakeBest', 0);
  body.querySelector('#s-best').textContent = best;
  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; over = false; paused = false; speed = speedSetting;
    placeFood();
    body.querySelector('#s-score').textContent = 0;
    lastTick = 0; acc = 0; draw();
  }
  function placeFood(){ while(true){ const x = Math.floor(Math.random()*COLS), y = Math.floor(Math.random()*ROWS); if(!snake.some(s => s.x===x && s.y===y)){ food = {x,y}; return; } } }
  function roundRect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); }
  function draw(){
    ctx.fillStyle = '#0c0c14'; ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.strokeStyle = 'rgba(255,255,255,.035)';
    for(let i=1;i<COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,SIZE); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(SIZE,i*CELL); ctx.stroke(); }
    const pulse = 1 + Math.sin(performance.now()/250)*0.12;
    ctx.fillStyle = '#ff5b8c';
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, (CELL/2-3)*pulse, 0, 7); ctx.fill();
    snake.forEach((s, i) => {
      const t = i / Math.max(1, snake.length - 1);
      const g = Math.round(140 + 115*(1-t));
      const b = Math.round(255 - 60*t);
      ctx.fillStyle = i === 0 ? '#a05bff' : `rgb(91,${g},${b})`;
      roundRect(ctx, s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2, i === 0 ? 7 : 4);
      ctx.fill();
    });
    if(over || paused){
      ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0,0,SIZE,SIZE);
      ctx.fillStyle = '#fff'; ctx.font = '300 34px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(over ? 'Game Over' : 'Paused', SIZE/2, SIZE/2 - 10);
      ctx.font = '400 15px sans-serif'; ctx.fillStyle = '#aaa';
      ctx.fillText('Score: ' + score, SIZE/2, SIZE/2 + 22);
    }
  }
  function step(){
    dir = nextDir;
    let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if(wallMode){ head.x = (head.x + COLS) % COLS; head.y = (head.y + ROWS) % ROWS; }
    if(!wallMode && (head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS)){ gameOver(); return; }
    if(snake.some((s,i) => i < snake.length-1 && s.x===head.x && s.y===head.y)){ gameOver(); return; }

  raf = requestAnimationFrame(loop);
  function setDir(nx, ny){ if(nx === -dir.x && ny === -dir.y) return; nextDir = {x:nx, y:ny}; }

    if(!openWindows.has(id)) return;

    if(k === 'arrowup' || k === 'w'){ setDir(0,-1); e.preventDefault(); }
    if(k === 'arrowdown' || k === 's'){ setDir(0,1); e.preventDefault(); }
    if(k === 'arrowleft' || k === 'a'){ setDir(-1,0); e.preventDefault(); }
    if(k === 'arrowright' || k === 'd'){ setDir(1,0); e.preventDefault(); }
    if(k === ' '){ if(!over) paused = !paused; e.preventDefault(); }
  });
  body.querySelector('#s-restart').onclick = reset;
  body.querySelector('#s-pause').onclick = () => { if(!over) paused = !paused; };
  body.querySelector('#s-speed').onchange = e => { speedSetting = +e.target.value; uSet('snakeSpeed', speedSetting); speed = speedSetting; };
  body.querySelector('#s-wall').onchange = e => { wallMode = e.target.checked; uSet('snakeWall', wallMode); };
  reset();
}

/* 2048 */
function app2048(){

  const boardEl = body.querySelector('#g-board');
  best = uGet('game2048Best', 0);
  body.querySelector('#g-best').textContent = best;
  function addRandom(){
    const empties = [];
    for(let y=0;y<4;y++) for(let x=0;x<4;x++) if(grid[y][x] === 0) empties.push([x,y]);
    if(!empties.length) return;
    const [x,y] = empties[Math.floor(Math.random()*empties.length)];
    grid[y][x] = Math.random() < 0.9 ? 2 : 4;
  }
  function reset(){ grid = Array.from({length:4}, () => Array(4).fill(0)); score = 0; over = false; won = false; addRandom(); addRandom(); body.querySelector('#g-score').textContent = 0; render(); }

  function slide(row){
    const a = row.filter(v => v !== 0);
    for(let i=0;i<a.length-1;i++){ if(a[i] === a[i+1]){ a[i] *= 2; score += a[i]; if(a[i] === 2048 && !won){ won = true; toast('2048!'); } a.splice(i+1, 1); } }
    while(a.length < 4) a.push(0);

  }

    if(over) return;
    const before = JSON.stringify(grid);
    if(dx !== 0){ for(let y=0;y<4;y++){ let r = grid[y].slice(); if(dx > 0) r.reverse(); r = slide(r); if(dx > 0) r.reverse(); grid[y] = r; } }
    else { for(let x=0;x<4;x++){ let c = [grid[0][x],grid[1][x],grid[2][x],grid[3][x]]; if(dy > 0) c.reverse(); c = slide(c); if(dy > 0) c.reverse(); for(let y=0;y<4;y++) grid[y][x] = c[y]; } }

      addRandom();
      body.querySelector('#g-score').textContent = score;
      render();
      if(score > best){ best = score; uSet('game2048Best', best); body.querySelector('#g-best').textContent = best; }

    }
  }
  function canMove(){ for(let y=0;y<4;y++) for(let x=0;x<4;x++){ if(grid[y][x] === 0) return true; if(x < 3 && grid[y][x] === grid[y][x+1]) return true; if(y < 3 && grid[y][x] === grid[y+1][x]) return true; } return false; }

    if(k === 'arrowright' || k === 'd'){ move(1,0); e.preventDefault(); }

/* TIC-TAC-TOE */
function appTTT(){
  const { body } = createWindow({ title:'Tic-Tac-Toe', icon:'tictactoe', width:440, height:580, appId:'tictactoe' });
  let board, turn, over, winCombo, wins;
  wins = uGet('tttWins', {you:0, cpu:0, draw:0});
  body.innerHTML = `<div class="game-wrap"><div class="game-hud"><span>You <b id="t-you">0</b></span><span>CPU <b id="t-cpu">0</b></span><span>Draw <b id="t-draw">0</b></span></div><div style="font-size:14px;color:#bbb" id="t-status">Your turn (X)</div><div class="ttt" id="t-board"></div><button class="btn" id="t-reset">🔄 New</button></div>`;
  function reset(){ board = Array(9).fill(''); turn = 'X'; over = false; winCombo = null; render(); body.querySelector('#t-status').textContent = 'Your turn (X)'; }
  function render(){
    const el = body.querySelector('#t-board'); el.innerHTML = '';
    board.forEach((v, i) => {
      const b = document.createElement('button');
      b.textContent = v;
      if(v === 'X') b.classList.add('x');
      if(v === 'O') b.classList.add('o');
      if(winCombo && winCombo.includes(i)) b.classList.add('win');
      b.onclick = () => play(i);
      el.appendChild(b);
    });
  }
  function play(i){ if(over || board[i] || turn !== 'X') return; board[i] = 'X'; render(); const w = winner(); if(w){ finish(w); return; } if(board.every(v => v)){ finish('draw'); return; } turn = 'O'; body.querySelector('#t-status').textContent = 'CPU thinking…'; setTimeout(cpuMove, 320); }
  function cpuMove(){
    if(over) return;
    for(let i=0;i<9;i++) if(!board[i]){ board[i]='O'; if(winner()==='O'){ render(); return finish('O'); } board[i]=''; }
    for(let i=0;i<9;i++) if(!board[i]){ board[i]='X'; if(winner()==='X'){ board[i]='O'; render(); turn='X'; body.querySelector('#t-status').textContent='Your turn (X)'; return; } board[i]=''; }
    if(!board[4]) board[4]='O';
    else { const corners = [0,2,6,8].filter(i => !board[i]); if(corners.length) board[corners[Math.floor(Math.random()*corners.length)]] = 'O'; else { const empty = board.map((v,i)=>v?null:i).filter(v => v !== null); if(empty.length) board[empty[Math.floor(Math.random()*empty.length)]] = 'O'; } }
    render();
    const w = winner(); if(w){ finish(w); return; }
    if(board.every(v => v)){ finish('draw'); return; }
    turn = 'X'; body.querySelector('#t-status').textContent = 'Your turn (X)';
  }
  function winner(){ const L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for(const combo of L){ const [a,b,c] = combo; if(board[a] && board[a] === board[b] && board[a] === board[c]){ winCombo = combo; return board[a]; } } return null; }
  function finish(w){ over = true; if(w === 'X'){ wins.you++; body.querySelector('#t-status').textContent = '🎉 You win!'; } else if(w === 'O'){ wins.cpu++; body.querySelector('#t-status').textContent = '💀 CPU wins'; } else { wins.draw++; body.querySelector('#t-status').textContent = '🤝 Draw'; } uSet('tttWins', wins); body.querySelector('#t-you').textContent = wins.you; body.querySelector('#t-cpu').textContent = wins.cpu; body.querySelector('#t-draw').textContent = wins.draw; render(); }
  body.querySelector('#t-you').textContent = wins.you;
  body.querySelector('#t-cpu').textContent = wins.cpu;
  body.querySelector('#t-draw').textContent = wins.draw;
  body.querySelector('#t-reset').onclick = reset;
  reset();
}

function appMemory(){
  const { body } = createWindow({ title:'Memory', icon:'memory', width:480, height:620, appId:'memory' });
  const ICONS = ['🍎','🍌','🍇','🍒','🍑','🥝','🍍','🥥'];
  let deck, flipped, matched, moves, lock;
  body.innerHTML = `<div class="game-wrap"><div class="game-hud"><span>Moves <b id="mm-moves">0</b></span><span>Pairs <b id="mm-pairs">0</b>/8</span><button id="mm-reset">🔄 New</button></div><div class="mem" id="mm-board"></div></div>`;
  function reset(){ deck = [...ICONS, ...ICONS].map(v => ({ v, id: Math.random() })).sort(() => Math.random() - 0.5); flipped = []; matched = 0; moves = 0; lock = false; body.querySelector('#mm-moves').textContent = 0; body.querySelector('#mm-pairs').textContent = 0; render(); }
  function render(){
    const el = body.querySelector('#mm-board'); el.innerHTML = '';
    deck.forEach((c, i) => {
      const b = document.createElement('button');
      const isUp = flipped.includes(i) || c.done;
      b.textContent = isUp ? c.v : '?';
      if(isUp) b.classList.add('up');
      if(c.done) b.classList.add('matched');

    if(flipped.length === 2){
      moves++;
      body.querySelector('#mm-moves').textContent = moves;
      const [a, b] = flipped;

    }

}

/* MINESWEEPER */
function appMines(){
  const { body } = createWindow({ title:'Minesweeper', icon:'mines', width:460, height:580, appId:'mines' });
  const W = 9, H = 9, MINES = 10;
  let grid, revealed, flagged, over;
  body.innerHTML = `<div class="mines"><div class="mines-hud"><span>💣 <b id="m-left">${MINES}</b></span><button class="btn" id="m-reset">🔄 New</button></div><div class="mines-grid" id="m-grid" style="grid-template-columns:repeat(${W},auto)"></div><div style="font-size:11.5px;color:#888;text-align:center">Right-click to flag</div></div>`;
  const gEl = body.querySelector('#m-grid');
  function init(){
    grid = Array.from({length:H}, () => Array(W).fill(0));
    revealed = Array.from({length:H}, () => Array(W).fill(false));
    flagged = Array.from({length:H}, () => Array(W).fill(false));
    over = false;
    let placed = 0;
    while(placed < MINES){ const x = Math.floor(Math.random()*W), y = Math.floor(Math.random()*H); if(grid[y][x] === -1) continue; grid[y][x] = -1; placed++; }
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      if(grid[y][x] === -1) continue;
      let c = 0;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const nx=x+dx, ny=y+dy; if(nx>=0&&ny>=0&&nx<W&&ny<H&&grid[ny][nx]===-1) c++; }
      grid[y][x] = c;
    }
    draw();
  }
  function draw(){
    gEl.innerHTML = '';
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const b = document.createElement('button');
      b.dataset.x = x; b.dataset.y = y;
      if(revealed[y][x]){ b.classList.add('rev'); if(grid[y][x] === -1){ b.textContent = '💣'; b.classList.add('boom'); } else if(grid[y][x] > 0){ b.textContent = grid[y][x]; b.dataset.n = grid[y][x] > 4 ? '5+' : grid[y][x]; } }
      else if(flagged[y][x]){ b.textContent = '🚩'; b.classList.add('flag'); }
      gEl.appendChild(b);
    }
    body.querySelector('#m-left').textContent = MINES - flagged.flat().filter(Boolean).length;
  }
  function reveal(x, y){ if(x<0||y<0||x>=W||y>=H || revealed[y][x] || flagged[y][x]) return; revealed[y][x] = true; if(grid[y][x] === -1){ over = true; return; } if(grid[y][x] === 0) for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) if(dx||dy) reveal(x+dx, y+dy); }
  gEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b || over) return;
    const x = +b.dataset.x, y = +b.dataset.y;
    if(flagged[y][x]) return;
    if(grid[y][x] === -1){ revealed[y][x] = true; over = true; draw(); return; }
    reveal(x, y); draw();
    let hidden = 0;
    for(let yy=0;yy<H;yy++) for(let xx=0;xx<W;xx++) if(!revealed[yy][xx]) hidden++;
    if(hidden === MINES){ over = true; toast('You win!'); }
  });
  gEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    const b = e.target.closest('button'); if(!b || over) return;
    const x = +b.dataset.x, y = +b.dataset.y;
    if(revealed[y][x]) return;
    flagged[y][x] = !flagged[y][x]; draw();
  });
  body.querySelector('#m-reset').onclick = init;
  init();
}

function appTetris(){

  const SHAPES = [

    { name:'O', color:'#fbbf24', cells:[[1,1],[1,1]] },
    { name:'T', color:'#a05bff', cells:[[0,1,0],[1,1,1]] },

  const cv = body.querySelector('#t-cv');
  const ctx = cv.getContext('2d');
  const nextCv = body.querySelector('#t-next');
  const nextCtx = nextCv.getContext('2d');
  const holdCv = body.querySelector('#t-hold');
  const holdCtx = holdCv.getContext('2d');
  let grid, current, queue, holdPiece, canHold;
  let score, lines, level, over, paused;
  let raf, lastDrop = 0, dropInterval = 800;
  let best = uGet('tetrisBest', 0);
  function newGrid(){ return Array.from({length:ROWS}, () => Array(COLS).fill(null)); }
  function cloneShape(s){ return { name:s.name, color:s.color, cells: s.cells.map(r => r.slice()) }; }
  function randShape(){ return cloneShape(SHAPES[Math.floor(Math.random()*SHAPES.length)]); }
  function refillQueue(){ while(queue.length < 3) queue.push(randShape()); }
  function spawn(){ refillQueue(); const next = queue.shift(); current = { ...cloneShape(next), x: Math.floor((COLS - next.cells[0].length) / 2), y: 0 }; canHold = true; if(collides(current, 0, 0)){ over = true; } drawNext(); drawHold(); }
  function collides(shape, dx, dy, cells){ const c = cells || shape.cells; for(let y=0;y<c.length;y++) for(let x=0;x<c[y].length;x++){ if(!c[y][x]) continue; const nx = shape.x + x + dx, ny = shape.y + y + dy; if(nx<0 || nx>=COLS || ny>=ROWS) return true; if(ny >= 0 && grid[ny][nx]) return true; } return false; }
  function lock(){
    current.cells.forEach((row, y) => row.forEach((v, x) => { if(v && current.y + y >= 0) grid[current.y + y][current.x + x] = current.color; }));
    let cleared = 0;
    for(let y=ROWS-1;y>=0;y--){ if(grid[y].every(c => c)){ grid.splice(y, 1); grid.unshift(Array(COLS).fill(null)); cleared++; y++; } }
    if(cleared){ lines += cleared; score += [0, 100, 300, 500, 800][cleared] * level; body.querySelector('#t-score').textContent = score; body.querySelector('#t-lines').textContent = lines; const nl = Math.floor(lines/10) + 1; if(nl > level){ level = nl; body.querySelector('#t-level').textContent = level; dropInterval = Math.max(100, 800 - (level-1)*60); } }

  function rotate(){ const old = current.cells; const rot = old[0].map((_, i) => old.map(r => r[i]).reverse()); for(const dx of [0, -1, 1, -2, 2]){ if(!collides(current, dx, 0, rot)){ current.cells = rot; current.x += dx; return; } } }
  function drop(){ if(collides(current, 0, 1)) lock(); else current.y++; }
  function hardDrop(){ let n = 0; while(!collides(current, 0, 1)){ current.y++; n++; } score += n*2; body.querySelector('#t-score').textContent = score; lock(); }

  function hold(){ if(!canHold) return; if(holdPiece === null){ holdPiece = { name:current.name, color:current.color, cells: current.cells.map(r => r.slice()) }; spawn(); } else { const tmp = holdPiece; holdPiece = { name:current.name, color:current.color, cells: current.cells.map(r => r.slice()) }; current = { ...cloneShape(tmp), x: Math.floor((COLS - tmp.cells[0].length) / 2), y: 0 }; } canHold = false; drawHold(); }
  function drawCell(c, x, y, color, ghost){ if(ghost){ c.strokeStyle = color; c.lineWidth = 2; c.strokeRect(x*CELL+2, y*CELL+2, CELL-4, CELL-4); return; } c.fillStyle = color; c.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2); c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(x*CELL+1, y*CELL+1, CELL-2, 4); }
  function draw(){

    for(let i=1;i<ROWS;i++){ ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(COLS*CELL,i*CELL); ctx.stroke(); }
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(grid[y][x]) drawCell(ctx, x, y, grid[y][x]);
    if(current && !over){
      let gy = current.y;

      current.cells.forEach((row, y) => row.forEach((v, x) => { if(v && gy + y >= 0 && gy !== current.y) drawCell(ctx, current.x + x, gy + y, current.color, true); }));
      current.cells.forEach((row, y) => row.forEach((v, x) => { if(v && current.y + y >= 0) drawCell(ctx, current.x + x, current.y + y, current.color); }));
    }
    if(over){ ctx.fillStyle = 'rgba(0,0,0,.78)'; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle = '#fff'; ctx.font = '300 32px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Game Over', cv.width/2, cv.height/2 - 10); ctx.font = '400 16px sans-serif'; ctx.fillStyle = '#aaa'; ctx.fillText('Score: ' + score, cv.width/2, cv.height/2 + 24); }

  }
  function drawMini(c2, shape, cell, cx, cy){ if(!shape) return; const w = shape.cells[0].length * cell, h = shape.cells.length * cell; const ox = cx - w/2, oy = cy - h/2; shape.cells.forEach((row, y) => row.forEach((v, x) => { if(v){ c2.fillStyle = shape.color; c2.fillRect(ox + x*cell + 1, oy + y*cell + 1, cell - 2, cell - 2); } })); }
  function drawNext(){ nextCtx.fillStyle = '#0c0c14'; nextCtx.fillRect(0,0,nextCv.width,nextCv.height); queue.slice(0, 3).forEach((s, i) => drawMini(nextCtx, s, 16, nextCv.width/2, 34 + i*60)); }
  function drawHold(){ holdCtx.fillStyle = '#0c0c14'; holdCtx.fillRect(0,0,holdCv.width,holdCv.height); if(holdPiece) drawMini(holdCtx, holdPiece, 16, holdCv.width/2, holdCv.height/2); }
  function reset(){ grid = newGrid(); queue = []; refillQueue(); holdPiece = null; canHold = true; score = 0; lines = 0; level = 1; over = false; paused = false; dropInterval = 800; body.querySelector('#t-score').textContent = 0; body.querySelector('#t-lines').textContent = 0; body.querySelector('#t-level').textContent = 1; spawn(); draw(); }
  function loop(t){ raf = requestAnimationFrame(loop); if(!openWindows.has(id)){ cancelAnimationFrame(raf); return; } if(over || paused){ draw(); return; } if(!lastDrop) lastDrop = t; if(t - lastDrop > dropInterval){ drop(); lastDrop = t; if(score > best){ best = score; uSet('tetrisBest', best); } } draw(); }
  document.addEventListener('keydown', e => {
    if(!openWindows.has(id)) return;
    const k = e.key;
    if(k === 'p' || k === 'P'){ if(!over){ paused = !paused; e.preventDefault(); } return; }
    if(paused || over) return;
    if(k === 'ArrowLeft'){ move(-1); e.preventDefault(); }
    if(k === 'ArrowRight'){ move(1); e.preventDefault(); }
    if(k === 'ArrowDown'){ drop(); lastDrop = performance.now(); e.preventDefault(); }
    if(k === 'ArrowUp'){ rotate(); e.preventDefault(); }
    if(k === ' '){ hardDrop(); e.preventDefault(); }
    if(k === 'c' || k === 'C'){ hold(); e.preventDefault(); }
  });
  body.querySelector('#t-restart').onclick = reset;
  body.querySelector('#t-pause').onclick = () => { if(!over) paused = !paused; };
  reset(); raf = requestAnimationFrame(loop);
}

/* SUDOKU */
function appSudoku(){
  const { body } = createWindow({ title:'Sudoku', icon:'sudoku', width:540, height:720, appId:'sudoku' });
  let puzzle, solution, selected = null, startTime, timer;
  let difficulty = 40;
  const givens = new Set();
  body.innerHTML = `<div class="sudoku-wrap"><div class="game-hud" style="font-size:12.5px"><label>Difficulty <select id="sd-diff" style="background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:#ddd;padding:4px 8px;border-radius:6px"><option value="30">Easy</option><option value="40" selected>Medium</option><option value="50">Hard</option><option value="58">Expert</option></select></label><span>Time <b id="sd-time">0:00</b></span></div><div class="sudoku-grid" id="s-grid"></div><div class="sudoku-pad" id="s-pad"></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" id="s-hint">💡 Hint</button><button class="btn" id="s-check">✓ Check</button><button class="btn primary" id="s-new">🔄 New</button></div></div>`;
  function genSolution(){
    const g = Array.from({length:9}, () => Array(9).fill(0));
    function valid(r, c, n){ for(let i=0;i<9;i++) if(g[r][i] === n || g[i][c] === n) return false; const br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3; for(let y=br;y<br+3;y++) for(let x=bc;x<bc+3;x++) if(g[y][x] === n) return false; return true; }
    function solve(pos=0){ if(pos === 81) return true; const r = Math.floor(pos/9), c = pos % 9; const nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5); for(const n of nums){ if(valid(r, c, n)){ g[r][c] = n; if(solve(pos+1)) return true; g[r][c] = 0; } } return false; }
    solve(); return g;
  }
  function makePuzzle(){
    solution = genSolution();
    puzzle = solution.map(row => row.slice());
    let removed = 0;
    while(removed < difficulty){ const r = Math.floor(Math.random()*9), c = Math.floor(Math.random()*9); if(puzzle[r][c] !== 0){ puzzle[r][c] = 0; removed++; } }
    startTime = Date.now(); clearInterval(timer);
    timer = setInterval(() => { const s = Math.floor((Date.now() - startTime)/1000); body.querySelector('#sd-time').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }, 1000);
  }
  function isGiven(y, x){ return givens.has(y+','+x); }
  function render(){
    const grid = body.querySelector('#s-grid'); grid.innerHTML = '';
    for(let y=0;y<9;y++) for(let x=0;x<9;x++){
      const cell = document.createElement('div');
      cell.className = 'sudoku-cell';
      if(x === 2 || x === 5) cell.classList.add('box-right');
      if(y === 2 || y === 5) cell.classList.add('box-bottom');
      cell.dataset.x = x; cell.dataset.y = y;
      const val = puzzle[y][x];
      if(val){ cell.textContent = val; if(isGiven(y, x)) cell.classList.add('given'); else if(val !== solution[y][x]) cell.classList.add('error'); }
      if(selected && selected.x === x && selected.y === y) cell.classList.add('selected');
      else if(selected && (selected.x === x || selected.y === y)) cell.classList.add('highlight');
      cell.onclick = () => { selected = {x, y}; render(); };
      grid.appendChild(cell);
    }
    const pad = body.querySelector('#s-pad'); pad.innerHTML = '';
    for(let n=1;n<=9;n++){ const btn = document.createElement('button'); btn.textContent = n; btn.onclick = () => placeNumber(n); pad.appendChild(btn); }
    const erase = document.createElement('button');
    erase.textContent = '⌫';
    erase.onclick = () => { if(!selected) return; if(isGiven(selected.y, selected.x)) return; puzzle[selected.y][selected.x] = 0; render(); };
    pad.appendChild(erase);
  }
  function placeNumber(n){ if(!selected) return; if(isGiven(selected.y, selected.x)) return; puzzle[selected.y][selected.x] = n; render(); if(puzzle.every((row, y) => row.every((v, x) => v === solution[y][x]))){ clearInterval(timer); setTimeout(() => toast('Solved!', 'Time: ' + body.querySelector('#sd-time').textContent), 200); } }
  function newPuzzle(){ makePuzzle(); givens.clear(); for(let y=0;y<9;y++) for(let x=0;x<9;x++){ if(puzzle[y][x] !== 0) givens.add(y+','+x); } selected = null; render(); }
  body.querySelector('#sd-diff').onchange = e => { difficulty = +e.target.value; newPuzzle(); };
  body.querySelector('#s-hint').onclick = () => { if(!selected){ toast('Select a cell'); return; } if(isGiven(selected.y, selected.x)) return; puzzle[selected.y][selected.x] = solution[selected.y][selected.x]; givens.add(selected.y+','+selected.x); render(); };
  body.querySelector('#s-check').onclick = () => { let errs = 0; for(let y=0;y<9;y++) for(let x=0;x<9;x++){ if(puzzle[y][x] && puzzle[y][x] !== solution[y][x]) errs++; } toast(errs ? errs + ' errors' : 'All correct!'); };
  body.querySelector('#s-new').onclick = newPuzzle;
  newPuzzle();
}

/* STOPWATCH */
function appStopwatch(){
  const { body, id } = createWindow({ title:'Stopwatch', icon:'stopwatch', width:460, height:600, appId:'stopwatch' });
  let startTime = null, elapsed = 0, running = false, laps = [];
  let raf;
  body.innerHTML = `<div class="sw-wrap"><div class="sw-display"><span id="sw-main">00:00</span><span class="sw-ms" id="sw-ms">.00</span></div><div class="sw-controls"><button class="primary" id="sw-start">▶ Start</button><button id="sw-lap">🚩 Lap</button><button id="sw-reset">↺ Reset</button></div><div class="sw-laps" id="sw-laps"></div></div>`;
  const fmt = ms => { const t = Math.floor(ms); const m = Math.floor(t/60000); const s = Math.floor((t%60000)/1000); const c = Math.floor((t%1000)/10); return { main: String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'), ms: '.' + String(c).padStart(2,'0') }; };
  function update(){ const total = elapsed + (running ? Date.now() - startTime : 0); const f = fmt(total); body.querySelector('#sw-main').textContent = f.main; body.querySelector('#sw-ms').textContent = f.ms; }
  function loop(){ raf = requestAnimationFrame(loop); if(!openWindows.has(id)){ cancelAnimationFrame(raf); return; } update(); }
  body.querySelector('#sw-start').onclick = e => { if(running){ elapsed += Date.now() - startTime; running = false; e.target.textContent = '▶ Start'; } else { startTime = Date.now(); running = true; e.target.textContent = '⏸ Pause'; } update(); };
  body.querySelector('#sw-lap').onclick = () => {
    if(!running) return;
    laps.push(elapsed + (Date.now() - startTime));
    const el = body.querySelector('#sw-laps');
    el.innerHTML = laps.map((t, i) => { const f = fmt(t); const prev = i > 0 ? laps[i-1] : 0; const diff = fmt(t - prev); return `<div class="sw-lap"><span>Lap ${i+1}</span><span>${f.main}${f.ms}</span><span style="color:#888">+${diff.main}${diff.ms}</span></div>`; }).join('');
  };
  body.querySelector('#sw-reset').onclick = () => { running = false; elapsed = 0; startTime = null; laps = []; body.querySelector('#sw-start').textContent = '▶ Start'; body.querySelector('#sw-main').textContent = '00:00'; body.querySelector('#sw-ms').textContent = '.00'; body.querySelector('#sw-laps').innerHTML = ''; };
  loop();
}

/* BREAKOUT */
function appBreakout(){
  const { body, id } = createWindow({ title:'Breakout', icon:'breakout', width:640, height:600, appId:'breakout' });
  const W = 560, H = 460;
  body.innerHTML = `<div class="game-wrap"><div class="game-hud"><span>Score <b id="bk-score">0</b></span><span>Lives <b id="bk-lives">3</b></span><span>Level <b id="bk-level">1</b></span></div><canvas id="bk-cv" width="${W}" height="${H}" class="brk-cv"></canvas><div style="font-size:12px;color:#888;text-align:center">← → move · Space launch</div></div>`;
  const cv = body.querySelector('#bk-cv'), ctx = cv.getContext('2d');
  let paddle, ball, bricks, score, lives, level, over, won, launched;
  let raf, keyState = {};
  function buildBricks(){
    bricks = [];
    const cols = 10, rows = 5;
    const bw = W/cols, bh = 22;
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
      bricks.push({ x: x*bw, y: 50 + y*bh, w: bw-2, h: bh-2, color: ['#5b8cff','#a05bff','#ff5b8c','#22c55e','#f59e0b'][y % 5], alive: true });
    }
  }
  function reset(full){
    if(full){ score = 0; lives = 3; level = 1; buildBricks(); }
    paddle = { x: W/2 - 50, y: H - 30, w: 100, h: 12 };
    ball = { x: W/2, y: H - 50, r: 6, vx: 0, vy: 0 };
    over = false; won = false; launched = false;
    body.querySelector('#bk-score').textContent = score;
    body.querySelector('#bk-lives').textContent = lives;
    body.querySelector('#bk-level').textContent = level;
  }
  function launch(){ if(launched) return; launched = true; const angle = -Math.PI/4 - Math.random()*Math.PI/6; const speed = 5 + level*0.3; ball.vx = Math.cos(angle)*speed; ball.vy = Math.sin(angle)*speed; }
  function draw(){
    ctx.fillStyle = '#0c0c14'; ctx.fillRect(0,0,W,H);
    bricks.forEach(b => { if(!b.alive) return; ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(b.x, b.y, b.w, 3); });
    ctx.fillStyle = '#5b8cff'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill();
    if(!launched && !over && !won){ ctx.fillStyle = '#aaa'; ctx.font = '400 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Press SPACE to launch', W/2, H/2); }
    if(over){ ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0,0,W,H); ctx.fillStyle = '#fff'; ctx.font = '300 34px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Game Over', W/2, H/2 - 10); ctx.font = '400 15px sans-serif'; ctx.fillStyle = '#aaa'; ctx.fillText('Score: ' + score, W/2, H/2 + 22); ctx.fillText('Press SPACE to restart', W/2, H/2 + 48); }
    if(won){ ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0,0,W,H); ctx.fillStyle = '#22c55e'; ctx.font = '300 34px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Level Clear!', W/2, H/2 - 10); ctx.fillStyle = '#fff'; ctx.font = '400 15px sans-serif'; ctx.fillText('Press SPACE for next level', W/2, H/2 + 22); }
  }
  function step(){
    if(!launched || over || won) return;
    ball.x += ball.vx; ball.y += ball.vy;
    if(ball.x - ball.r < 0){ ball.x = ball.r; ball.vx *= -1; }
    if(ball.x + ball.r > W){ ball.x = W - ball.r; ball.vx *= -1; }
    if(ball.y - ball.r < 0){ ball.y = ball.r; ball.vy *= -1; }
    if(ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w && ball.vy > 0){
      const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      const angle = hit * Math.PI/3;
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(angle)*speed;
      ball.vy = -Math.cos(angle)*speed;
      ball.y = paddle.y - ball.r;
    }
    for(const b of bricks){
      if(!b.alive) continue;
      if(ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h){
        b.alive = false;
        score += 10;
        body.querySelector('#bk-score').textContent = score;
        const ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if(ox < oy) ball.vx *= -1; else ball.vy *= -1;
        break;
      }
    }
    if(ball.y - ball.r > H){ lives--; body.querySelector('#bk-lives').textContent = lives; if(lives <= 0) over = true; else reset(false); }
    if(bricks.every(b => !b.alive)) won = true;
  }
  function loop(){
    raf = requestAnimationFrame(loop);
    if(!openWindows.has(id)){ cancelAnimationFrame(raf); return; }
    if(keyState['ArrowLeft'] || keyState['a']) paddle.x = Math.max(0, paddle.x - 7);
    if(keyState['ArrowRight'] || keyState['d']) paddle.x = Math.min(W - paddle.w, paddle.x + 7);
    step(); draw();
  }
  const kd = e => {
    if(!openWindows.has(id)){ document.removeEventListener('keydown', kd); document.removeEventListener('keyup', ku); return; }
    keyState[e.key] = true;
    if(e.key === ' '){
      e.preventDefault();
      if(over){ score = 0; lives = 3; level = 1; buildBricks(); reset(true); }
      else if(won){ level++; body.querySelector('#bk-level').textContent = level; buildBricks(); reset(false); }
      else launch();
    }
  };
  const ku = e => { keyState[e.key] = false; };
  document.addEventListener('keydown', kd);
  document.addEventListener('keyup', ku);
  reset(true); loop();
}
