<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mid OS v1.1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff}
body{background:#000;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;color:inherit}
:root{--accent:#5b8cff;--glass:rgba(28,28,34,.72);--win:rgba(22,22,28,.94);--stroke:rgba(255,255,255,.10);--dim:#9a9aa8}
.hidden{display:none!important}
.icon-wrap{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5b8cff28,#a05bff1c);border-radius:8px;flex-shrink:0;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);font-weight:600;text-align:center}

#boot{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#12122a,#05050a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:99999;transition:opacity .8s}
#boot.hide{opacity:0;pointer-events:none}
.blogo{font-size:82px;font-weight:900;letter-spacing:-4px;background:linear-gradient(120deg,#5b8cff,#a05bff,#ff5b8c,#5b8cff);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 4s ease infinite}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.bsub{color:#5a5a72;font-size:12px;letter-spacing:4px;text-transform:uppercase}
.bver{color:#5b8cff;font-size:11px;letter-spacing:3px;font-weight:700;padding:4px 12px;border:1px solid rgba(91,140,255,.4);border-radius:99px}
.bbar{width:240px;height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.bfill{height:100%;width:0;background:linear-gradient(90deg,#5b8cff,#a05bff,#ff5b8c);animation:load 2s forwards}
@keyframes load{to{width:100%}}

#lockscreen{position:fixed;inset:0;z-index:9990;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:linear-gradient(160deg,#0a0a14,#1a1a2e);transition:opacity .5s}
#lockscreen.hide{opacity:0;pointer-events:none}
.lock-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.6)}
.lock-top{padding:60px 20px 0;text-align:center;position:relative;z-index:2}
.lock-time{font-size:96px;font-weight:200;letter-spacing:-4px;line-height:1}
.lock-date{font-size:18px;color:#bbb;margin-top:8px;font-weight:300}
.lock-bottom{width:100%;padding:30px 20px 60px;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px}
.lock-hint{color:#aaa;font-size:14px;letter-spacing:1px}
.lock-users{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.lock-user{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);min-width:100px;transition:background .2s,transform .2s}
.lock-user:hover{background:rgba(255,255,255,.14);transform:translateY(-3px)}
.lock-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#a05bff);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff}
.lock-name{font-size:13px;color:#ddd}

#loginpanel{position:fixed;inset:0;z-index:9991;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(5,5,12,.85);backdrop-filter:blur(20px)}
.login-avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#a05bff);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#fff}
.login-name{font-size:22px;font-weight:600}
.login-row{display:flex;gap:8px}
.login-row input{padding:12px 16px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#fff;font-size:14px;outline:none;width:240px}
.login-row button{padding:12px 22px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600}
.login-err{color:#ff8080;font-size:12.5px;min-height:16px}
.login-back{position:absolute;top:24px;left:24px;padding:8px 16px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#ddd;font-size:13px}

#wallpaper{position:fixed;inset:0;background-size:cover;background-position:center;transition:background 1.1s;z-index:0}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.55}

#menubar{position:fixed;top:0;left:0;right:0;height:30px;background:var(--glass);backdrop-filter:blur(24px);border-bottom:1px solid var(--stroke);display:flex;align-items:center;padding:0 12px;gap:4px;font-size:13px;z-index:9000}
.mb-logo{font-weight:900;font-size:14.5px;padding:0 8px;background:linear-gradient(120deg,#5b8cff,#a05bff);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;display:flex;align-items:center;gap:6px}
.mb-logo small{font-size:9.5px;letter-spacing:1px;opacity:.9}
.mb-item{padding:3px 10px;border-radius:7px;cursor:pointer;color:#d6d6e0;transition:background .18s}
.mb-item:hover{background:rgba(255,255,255,.12)}
#menubar .spacer{flex:1}
#mb-user{display:flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;border-radius:99px;cursor:pointer;background:rgba(255,255,255,.06);font-size:12px}
#mb-user:hover{background:rgba(255,255,255,.14)}
#mb-user .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#a05bff);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
#clock{font-variant-numeric:tabular-nums;color:#d6d6e0;padding:0 8px;font-size:12.5px}

#icons{position:fixed;top:44px;left:0;right:0;bottom:70px;z-index:10;pointer-events:none}
.icon{position:absolute;width:100px;padding:10px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;text-align:center;pointer-events:auto;user-select:none;-webkit-user-select:none;transition:background .15s}
.icon:hover{background:rgba(255,255,255,.10)}
.icon.selected{background:rgba(91,140,255,.28);box-shadow:inset 0 0 0 1px rgba(91,140,255,.5)}
.icon .icon-wrap{width:42px;height:42px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55));font-size:28px;pointer-events:none}
.icon .nm{font-size:11.5px;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.95);word-break:break-word;line-height:1.25;font-weight:500;pointer-events:none}
.icon.placing{opacity:.6;pointer-events:none}

#widgets{position:fixed;top:44px;right:16px;display:flex;flex-direction:column;gap:12px;z-index:5;pointer-events:none;max-height:calc(100vh - 120px)}
.widget{width:260px;background:rgba(22,22,28,.82);backdrop-filter:blur(20px);border:1px solid var(--stroke);border-radius:16px;padding:16px;box-shadow:0 20px 44px rgba(0,0,0,.4);pointer-events:auto;cursor:grab;transition:box-shadow .2s}
.widget:hover{box-shadow:0 24px 50px rgba(0,0,0,.5)}
.widget.dragging{cursor:grabbing;opacity:.92;z-index:10000;box-shadow:0 30px 70px rgba(0,0,0,.75)}
.widget h4{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--dim);font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.widget .wclose{background:transparent;border:0;color:#666;font-size:14px;padding:0 4px;cursor:pointer}
.widget .wclose:hover{color:#ff5f57}
.wg-time{font-size:44px;font-weight:200;letter-spacing:-2px;line-height:1}
.wg-date{font-size:12.5px;color:#aaa;margin-top:4px}
.wg-bigtime{font-size:52px;font-weight:200;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.wg-weather{display:flex;align-items:center;gap:14px}
.wg-temp{font-size:38px;font-weight:200;letter-spacing:-2px}
.wg-cond{font-size:11.5px;color:#aaa;text-transform:capitalize}
.wg-todo{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.wg-todo-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;background:rgba(255,255,255,.05)}
.wg-todo-item .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.wg-todo-item .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg-todo .empty{color:#666;font-size:12px}
.wg-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px}
.wg-cal .dn{color:#666;text-align:center;font-weight:700;text-transform:uppercase;font-size:9px}
.wg-cal .dc{text-align:center;padding:3px 0;border-radius:5px;color:#bbb}
.wg-cal .dc.today{background:var(--accent);color:#fff;font-weight:700}
.wg-note{width:100%;height:110px;background:rgba(0,0,0,.3);border:1px solid var(--stroke);border-radius:10px;padding:10px;color:#e6e6ee;font-size:12.5px;resize:none;outline:none;font-family:inherit;line-height:1.5}
.wg-system{display:flex;flex-direction:column;gap:12px;font-size:12.5px}
.wg-bar{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.wg-bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.wg-sys-row{display:flex;justify-content:space-between;margin-bottom:5px;font-size:11.5px;color:#aaa}
.wg-quote{font-size:13px;font-style:italic;line-height:1.65;color:#ddd}
.wg-quote-author{font-size:11.5px;color:#888;margin-top:10px;text-align:right}
.wg-calc-in{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--stroke);border-radius:8px;padding:9px 12px;color:#fff;font-size:16px;font-variant-numeric:tabular-nums;text-align:right;outline:none;margin-bottom:8px;font-family:inherit}
.wg-calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.wg-calc-pad button{padding:10px 4px;border-radius:8px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#eee;font-size:13px;font-weight:600}
.wg-calc-pad button:hover{background:rgba(255,255,255,.15)}
.wg-calc-pad button[data-k="="]{background:var(--accent);border-color:transparent}
.wg-stocks{display:flex;flex-direction:column;gap:5px;font-size:12px}
.wg-stock{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04)}
.wg-stock-sym{font-weight:700;color:var(--accent);min-width:50px}
.wg-stock-change{font-size:11px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.wg-stock-change.up{color:#22c55e}
.wg-stock-change.down{color:#ff5f57}

.window{position:fixed;min-width:340px;min-height:200px;background:var(--win);backdrop-filter:blur(26px);border:1px solid var(--stroke);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.68),0 0 0 1px rgba(255,255,255,.04) inset;animation:winOpen .32s cubic-bezier(.34,1.4,.5,1)}
@keyframes winOpen{0%{opacity:0;transform:scale(.88) translateY(24px);filter:blur(6px)}100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}}
.window.closing{animation:winClose .22s forwards}
@keyframes winClose{to{opacity:0;transform:scale(.86) translateY(18px);filter:blur(5px)}}
.window.minimizing{animation:winMin .32s forwards}
@keyframes winMin{to{opacity:0;transform:scale(.35) translateY(60vh);filter:blur(8px)}}
.window.focused{box-shadow:0 34px 90px rgba(0,0,0,.75),0 0 0 1px rgba(91,140,255,.35),0 0 40px -8px rgba(91,140,255,.4)}
.window.minimized{display:none}
.window.maximized{border-radius:0!important}
.window.snapping{transition:left .22s,top .22s,width .22s,height .22s}
.window.dragging{transition:none!important}
.window.dragging .wbody{pointer-events:none}
.titlebar{height:38px;display:flex;align-items:center;gap:12px;padding:0 12px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border-bottom:1px solid var(--stroke);cursor:grab;flex-shrink:0;user-select:none}
.titlebar:active{cursor:grabbing}
.lights{display:flex;gap:10px;flex-shrink:0;align-items:center}
.light{width:17px;height:17px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;line-height:1;color:rgba(0,0,0,.82);transition:transform .18s,box-shadow .18s;box-shadow:0 1px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.18)}
.light span{opacity:.9;pointer-events:none}
.light:hover{transform:scale(1.22)}
.light.close{background:radial-gradient(circle at 35% 30%,#ff8880,#ff5f57 60%,#e0443c)}
.light.close:hover{box-shadow:0 2px 14px rgba(255,95,87,.75),0 0 0 2px rgba(255,95,87,.35)}
.light.min{background:radial-gradient(circle at 35% 30%,#ffd76b,#febc2e 60%,#e0a01a)}
.light.min:hover{box-shadow:0 2px 14px rgba(254,188,46,.75),0 0 0 2px rgba(254,188,46,.35)}
.light.max{background:radial-gradient(circle at 35% 30%,#5ee07a,#28c840 60%,#1ea030)}
.light.max:hover{box-shadow:0 2px 14px rgba(40,200,64,.75),0 0 0 2px rgba(40,200,64,.35)}
.wtitle{font-size:13px;color:#dcdce8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center;padding-right:75px;font-weight:600;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:8px}
.wtitle .icon-wrap{width:18px;height:18px;font-size:12px}
.wbody{flex:1;overflow:auto;position:relative}
.resizer{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:5}
.resizer::after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid rgba(255,255,255,.22);border-bottom:2px solid rgba(255,255,255,.22)}
#snapPreview{position:fixed;border:2px solid var(--accent);background:rgba(91,140,255,.18);border-radius:12px;pointer-events:none;z-index:8999;display:none}
#snapPreview.on{display:block}

#taskbar{position:fixed;bottom:0;left:0;right:0;height:54px;background:var(--glass);backdrop-filter:blur(26px);border-top:1px solid var(--stroke);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 12px;z-index:9000}
.tb-left,.tb-center,.tb-right{display:flex;align-items:center;gap:6px}
.tb-center{justify-content:center;max-width:60vw}
.tb-right{justify-self:end}
#startbtn{width:42px;height:42px;border-radius:11px;border:0;background:linear-gradient(135deg,#5b8cff,#a05bff);color:#fff;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .22s,filter .2s;box-shadow:0 4px 14px -2px rgba(91,140,255,.5)}
#startbtn:hover{filter:brightness(1.18);transform:scale(1.07)}
#startbtn:active{transform:scale(.95)}
.tb-tasks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 2px;max-width:calc(60vw - 60px)}
.tb-tasks::-webkit-scrollbar{display:none}
.task{height:40px;padding:0 13px;border-radius:10px;background:rgba(255,255,255,.055);border:1px solid transparent;display:flex;align-items:center;gap:8px;font-size:12.5px;color:#ddd;max-width:190px;white-space:nowrap;flex-shrink:0;transition:background .2s,transform .18s,border-color .2s}
.task:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.task.active{background:rgba(91,140,255,.26);border-color:rgba(91,140,255,.55)}
.task.removing{opacity:0;transform:scale(.7);transition:all .2s}
.task .tdot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
.task .icon-wrap{width:18px;height:18px;font-size:12px}
.tray button{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:#ddd;font-size:13px;font-weight:600;transition:background .2s,transform .18s;display:flex;align-items:center;justify-content:center}
.tray button:hover{background:rgba(255,255,255,.13);transform:scale(1.06)}

#startmenu{position:fixed;left:12px;bottom:66px;width:600px;background:var(--win);backdrop-filter:blur(30px);border:1px solid var(--stroke);border-radius:16px;padding:20px;box-shadow:0 30px 70px rgba(0,0,0,.7);z-index:9500;display:none;max-height:74vh;overflow:hidden;flex-direction:column}
#startmenu.open{display:flex;animation:startIn .28s cubic-bezier(.34,1.4,.5,1)}
@keyframes startIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.sm-search{width:100%;padding:10px 16px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:#fff;font-size:13.5px;outline:none;margin-bottom:16px}
.sm-search:focus{border-color:var(--accent)}
.sm-section-title{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.sm-section-title button{background:transparent;border:0;color:var(--dim);font-size:11px;cursor:pointer;letter-spacing:0;text-transform:none;font-weight:500}
.sm-pinned,.sm-allapps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:340px;overflow-y:auto;padding-right:4px}
.sm-allapps{display:none}
.sm-allapps.show{display:grid}
.sm-app{padding:14px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;font-size:10.5px;text-align:center;color:#ddd;transition:background .18s,transform .2s}
.sm-app:hover{background:rgba(255,255,255,.11);transform:translateY(-2px) scale(1.05)}
.sm-app .icon-wrap{width:34px;height:34px;font-size:22px}
.sm-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--stroke);margin-top:8px}
.sm-user{display:flex;align-items:center;gap:10px;font-size:13px;color:#ddd;padding:8px 12px;border-radius:10px;cursor:pointer}
.sm-user:hover{background:rgba(255,255,255,.1)}
.sm-user .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#a05bff);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.sm-power{display:flex;gap:6px}
.sm-power button{width:38px;height:38px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#ddd;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.sm-power button:hover{background:rgba(255,255,255,.15)}

#powermenu{position:fixed;right:12px;bottom:66px;width:200px;background:var(--win);backdrop-filter:blur(30px);border:1px solid var(--stroke);border-radius:14px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.7);z-index:9500;display:none}
#powermenu.open{display:block;animation:startIn .24s}
.pm-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:13px;color:#ddd;transition:background .18s}
.pm-row:hover{background:rgba(255,255,255,.11)}
.pm-row.danger:hover{background:rgba(255,60,60,.22)}

.ctx-menu{position:fixed;background:var(--win);backdrop-filter:blur(24px);border:1px solid var(--stroke);border-radius:12px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.7);z-index:9600;min-width:200px;font-size:13px}
.ctx-item{padding:9px 12px;border-radius:7px;cursor:pointer;color:#ddd;display:flex;align-items:center;gap:10px;transition:background .15s}
.ctx-item:hover{background:rgba(255,255,255,.11)}
.ctx-sep{height:1px;background:var(--stroke);margin:4px 2px}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:9800}
#modal.open{display:flex}
.mbox{width:min(460px,92vw);background:#1c1c24;border:1px solid var(--stroke);border-radius:16px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.8)}
.mbox h3{font-size:17px;margin-bottom:5px}
.mbox p.sub{font-size:12px;color:var(--dim);margin-bottom:18px;line-height:1.55}
.field{margin-bottom:13px}
.field label{display:block;font-size:10.5px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:1.4px;font-weight:600}
.field input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:#fff;font-size:13px;outline:none}
.field input:focus{border-color:var(--accent)}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn{padding:10px 20px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.07);color:#eee;font-size:13px;transition:background .18s}
.btn:hover{background:rgba(255,255,255,.15)}
.btn.primary{background:var(--accent);border-color:transparent;font-weight:600}
.btn.danger{color:#ff8080}

.pane{display:flex;height:100%;font-size:13px}
.sidebar{width:168px;background:rgba(255,255,255,.03);border-right:1px solid var(--stroke);padding:10px 8px;flex-shrink:0;overflow:auto}
.side-item{padding:9px 11px;border-radius:9px;cursor:pointer;color:#cfcfda;display:flex;align-items:center;gap:9px;font-size:12.5px;transition:background .18s}
.side-item:hover{background:rgba(255,255,255,.09)}
.side-item.active{background:rgba(91,140,255,.26)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--stroke);flex-shrink:0;flex-wrap:wrap}
.toolbar button{padding:7px 12px;border-radius:8px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#ddd;font-size:12px}
.toolbar button:hover{background:rgba(255,255,255,.15)}
.path{flex:1;min-width:120px;padding:7px 11px;border-radius:8px;background:rgba(0,0,0,.28);border:1px solid var(--stroke);color:#bbb;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;align-content:start}
.fitem{padding:13px 6px;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center;font-size:11.5px;color:#ddd;word-break:break-word;transition:background .18s}
.fitem:hover{background:rgba(255,255,255,.09)}
.fitem.sel{background:rgba(91,140,255,.32)}
.fitem .icon-wrap{width:38px;height:38px;font-size:24px}
.empty{color:#666;font-size:12.5px;padding:28px;text-align:center;grid-column:1/-1}

.np-wrap{display:flex;flex-direction:column;height:100%}
.np-ta{flex:1;background:transparent;border:0;outline:none;color:#e6e6ee;padding:18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.7;resize:none}

.calc{padding:14px;display:flex;flex-direction:column;gap:12px;height:100%}
.calc-disp{background:rgba(0,0,0,.4);border-radius:12px;padding:20px 18px;text-align:right;font-size:34px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;min-height:82px}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{border:1px solid var(--stroke);background:rgba(255,255,255,.07);color:#eee;border-radius:11px;font-size:18px}
.calc-grid button:hover{background:rgba(255,255,255,.17)}
.calc-grid button.op{background:rgba(91,140,255,.22)}
.calc-grid button.eq{background:var(--accent);font-weight:700}

.term{height:100%;display:flex;flex-direction:column;background:rgba(0,0,0,.62);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.term-out{flex:1;overflow:auto;padding:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:#b9f5b9}
.term-line{display:flex;gap:9px;padding:0 16px 16px;flex-shrink:0;align-items:center}
.term-line span{color:var(--accent);font-weight:600;white-space:nowrap}
.term-line input{flex:1;background:transparent;border:0;outline:none;color:#b9f5b9;font-family:inherit;font-size:13px}

.set{padding:22px;overflow:auto;height:100%}
.set h4{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--dim);margin:0 0 14px;font-weight:700}
.set h4:not(:first-child){margin-top:30px}
.viewmode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vm-card{padding:16px 10px;border-radius:14px;border:2px solid var(--stroke);background:rgba(255,255,255,.04);cursor:pointer;text-align:center;transition:transform .22s,border-color .2s,background .2s}
.vm-card:hover{transform:translateY(-3px);background:rgba(255,255,255,.08)}
.vm-card.active{border-color:var(--accent);background:rgba(91,140,255,.16);box-shadow:0 0 20px -4px var(--accent)}
.vm-name{font-size:13px;font-weight:600;margin-bottom:3px;color:#fff}
.vm-desc{font-size:10.5px;color:var(--dim);line-height:1.4}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.wp{height:74px;border-radius:12px;cursor:pointer;border:2px solid transparent;background-size:cover;background-position:center;transition:transform .22s}
.wp:hover{transform:scale(1.06)}
.wp.active{border-color:var(--accent);box-shadow:0 0 20px -4px var(--accent)}
.row{display:flex;gap:9px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
.row input[type=text]{flex:1;min-width:160px;padding:10px 12px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:#fff;font-size:13px;outline:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw.active{border-color:#fff;box-shadow:0 0 14px -2px #fff}
.applist{display:flex;flex-direction:column;gap:8px}
.approw{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;background:rgba(255,255,255,.05);font-size:13px}
.approw .grow{flex:1;overflow:hidden}
.approw .u{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.approw button{padding:6px 11px;border-radius:8px;border:1px solid var(--stroke);background:transparent;color:#ff8080;font-size:11.5px}
.widget-toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.widget-toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:10px 12px;background:rgba(255,255,255,.05);border-radius:10px;border:1px solid var(--stroke)}
.widget-toggle:hover{background:rgba(255,255,255,.09)}
.widget-toggle input{cursor:pointer;accent-color:var(--accent)}

.paint{display:flex;flex-direction:column;height:100%;background:#1a1a20}
.paint-tools{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--stroke);flex-wrap:wrap;flex-shrink:0;background:rgba(0,0,0,.3)}
.paint-tools button{padding:7px 10px;border-radius:8px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#ddd;font-size:12px;min-width:36px}
.paint-tools button:hover{background:rgba(255,255,255,.15)}
.paint-tools button.on{background:var(--accent);border-color:transparent;color:#fff}
.paint-tools input[type=color]{width:38px;height:32px;border:1px solid var(--stroke);border-radius:8px;background:transparent;cursor:pointer;padding:2px}
.paint-tools input[type=range]{width:100px;accent-color:var(--accent)}
.paint-tools .divider{width:1px;height:24px;background:var(--stroke);margin:0 4px}
.paint-canvas{flex:1;position:relative;overflow:hidden;background:#fff;min-height:200px;cursor:crosshair}
.paint-canvas canvas{position:absolute;top:0;left:0;display:block;touch-action:none}
.paint-swatches{display:flex;gap:3px}
.paint-sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--stroke);cursor:pointer}
.paint-sw.active{border:2px solid #fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
.paint-status{padding:6px 12px;font-size:11.5px;color:var(--dim);background:rgba(0,0,0,.28);border-top:1px solid var(--stroke);display:flex;gap:14px;flex-shrink:0}

.music{display:flex;flex-direction:column;height:100%}
.mplayer{padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.m-cover{width:170px;height:170px;border-radius:20px;background:linear-gradient(135deg,#5b8cff33,#a05bff33);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center}
.m-cover .icon-wrap{width:110px;height:110px;font-size:64px}
.m-cover.spin{animation:spin8 8s linear infinite}
@keyframes spin8{to{transform:rotate(360deg)}}
.m-title{font-size:15px;font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-sub{font-size:11.5px;color:var(--dim);text-align:center}
.m-progress{width:100%;max-width:340px;display:flex;flex-direction:column;gap:5px}
.m-progress input{width:100%;accent-color:var(--accent)}
.m-times{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.m-controls button{width:60px;height:60px;border-radius:50%;border:1px solid var(--stroke);background:var(--accent);color:#fff;font-size:18px;font-weight:700;border-color:transparent}
.m-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.m-list{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px}
.m-track{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-size:12.5px;cursor:pointer}
.m-track:hover{background:rgba(255,255,255,.10)}
.m-track.active{background:rgba(91,140,255,.22);border-left:3px solid var(--accent)}
.m-track .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-track .x{color:#ff8080;font-size:14px;padding:0 4px;font-weight:700}

.br{display:flex;flex-direction:column;height:100%}
.br-toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--stroke);flex-shrink:0;flex-wrap:wrap}
.br-toolbar button{padding:7px 12px;border-radius:8px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#ddd;font-size:12px}
.br-toolbar button:hover:not(:disabled){background:rgba(255,255,255,.15)}
.br-toolbar button:disabled{opacity:.35;cursor:default}
.br-url{flex:1;min-width:150px;padding:8px 12px;border-radius:9px;background:rgba(0,0,0,.32);border:1px solid var(--stroke);color:#ddd;font-size:12.5px;outline:none}
.br-url:focus{border-color:var(--accent)}
.br-modes{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--stroke);background:rgba(0,0,0,.18);font-size:11.5px;color:var(--dim);align-items:center;flex-wrap:wrap;flex-shrink:0}
.br-modes button{padding:4px 11px;border-radius:99px;border:1px solid var(--stroke);background:transparent;color:#bbb;font-size:11px}
.br-modes button.on{background:rgba(91,140,255,.28);border-color:rgba(91,140,255,.5);color:#fff}
.br-status{flex:1;font-size:11px;text-align:right;color:var(--dim)}
.br-host{flex:1;position:relative;background:#fff;overflow:hidden}
.br-host iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.br-loading{position:absolute;inset:0;background:rgba(12,12,20,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#888;font-size:13px;z-index:5}
.br-loading .spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);animation:spin8 .8s linear infinite}
.br-home{padding:36px 24px;display:flex;flex-direction:column;align-items:center;gap:24px;background:linear-gradient(160deg,#12121a,#0a0a10);height:100%;overflow:auto}
.br-home h2{font-size:26px;font-weight:300}
.br-home p{color:var(--dim);font-size:12.5px;text-align:center;max-width:560px;line-height:1.7}
.br-searchbar{width:100%;max-width:600px;display:flex;gap:8px}
.br-searchbar input{flex:1;padding:14px 18px;border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.32);color:#fff;font-size:14px;outline:none}
.br-searchbar input:focus{border-color:var(--accent)}
.br-searchbar button{padding:0 24px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.br-quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:100%;max-width:680px}
.br-q{padding:18px 10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);cursor:pointer;text-align:center;font-size:12px;color:#ddd;transition:background .18s,transform .2s}
.br-q:hover{background:rgba(255,255,255,.12);transform:translateY(-3px)}
.br-q .e{font-size:28px;display:block;margin-bottom:8px}
.br-blocked{padding:40px 24px;text-align:center;color:#ccc;font-size:13px;line-height:1.8;background:#12121a;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:auto}
.br-blocked .emo{font-size:52px}
.br-blocked code{background:rgba(0,0,0,.5);padding:2px 8px;border-radius:5px;font-size:11.5px;color:#f0a5c0}
.br-article{padding:32px 40px;background:#f5f5f7;color:#111;height:100%;overflow:auto;font-family:Georgia,serif;font-size:15px;line-height:1.75}
.br-article h1,.br-article h2,.br-article h3{font-family:-apple-system,sans-serif;color:#111;margin:20px 0 10px}
.br-article h1{font-size:28px}
.br-article a{color:#0066cc}
.br-article code{background:rgba(0,0,0,.08);padding:2px 6px;border-radius:4px;font-family:ui-monospace,monospace;font-size:13px}
.br-article img{max-width:100%;border-radius:8px;margin:10px 0}

.game-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;overflow:auto}
.game-hud{display:flex;gap:22px;align-items:center;font-size:13px;flex-wrap:wrap;justify-content:center}
.game-hud b{color:var(--accent);font-size:18px;font-variant-numeric:tabular-nums}
.game-hud button{padding:7px 15px;border-radius:9px;border:1px solid var(--stroke);background:rgba(255,255,255,.07);color:#eee;font-size:12px}
.snake-cv{border-radius:12px;background:#0c0c14;border:1px solid var(--stroke);max-width:100%;height:auto;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(0,0,0,.35);padding:10px;border-radius:14px;width:min(360px,84vw);height:min(360px,84vw);border:1px solid var(--stroke)}
.g2048 .t{border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,5vw,28px);font-weight:800;background:rgba(255,255,255,.05)}
.g2048 .t[data-v="2"]{background:#eee4da;color:#776e65}
.g2048 .t[data-v="4"]{background:#ede0c8;color:#776e65}
.g2048 .t[data-v="8"]{background:#f2b179;color:#fff}
.g2048 .t[data-v="16"]{background:#f59563;color:#fff}
.g2048 .t[data-v="32"]{background:#f67c5f;color:#fff}
.g2048 .t[data-v="64"]{background:#f65e3b;color:#fff}
.g2048 .t[data-v="128"]{background:#edcf72;color:#fff}
.g2048 .t[data-v="256"]{background:#edcc61;color:#fff}
.g2048 .t[data-v="512"]{background:#edc850;color:#fff}
.g2048 .t[data-v="1024"]{background:#edc53f;color:#fff}
.g2048 .t[data-v="2048"]{background:#edc22e;color:#fff}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(300px,80vw);height:min(300px,80vw)}
.ttt button{border:1px solid var(--stroke);background:rgba(255,255,255,.06);border-radius:14px;font-size:clamp(38px,14vw,60px);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center}
.ttt button.x{color:#5b8cff}
.ttt button.o{color:#ff5b8c}
.ttt button.win{background:rgba(34,197,94,.35);box-shadow:0 0 20px -2px #22c55e}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(380px,86vw)}
.mem button{aspect-ratio:1;border:1px solid var(--stroke);background:rgba(255,255,255,.06);border-radius:12px;font-size:clamp(22px,6vw,34px);display:flex;align-items:center;justify-content:center;color:transparent;transition:all .22s}
.mem button.up{background:rgba(91,140,255,.32);color:#fff}
.mem button.matched{background:rgba(34,197,94,.28);border-color:rgba(34,197,94,.5);color:#fff}
.mines{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;height:100%;justify-content:center;overflow:auto}
.mines-hud{display:flex;gap:20px;font-size:14px;align-items:center}
.mines-hud b{color:var(--accent)}
.mines-grid{display:grid;gap:3px;background:rgba(255,255,255,.05);padding:10px;border-radius:12px}
.mines-grid button{width:30px;height:30px;border-radius:6px;border:1px solid var(--stroke);background:rgba(255,255,255,.10);color:#eee;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mines-grid button.rev{background:rgba(0,0,0,.35);cursor:default}
.mines-grid button.boom{background:#ff5f57}
.mines-grid button.flag{background:rgba(255,190,50,.35)}
.mines-grid button[data-n="1"]{color:#5b8cff}
.mines-grid button[data-n="2"]{color:#22c55e}
.mines-grid button[data-n="3"]{color:#ef4444}
.mines-grid button[data-n="4"]{color:#a05bff}
.mines-grid button[data-n="5+"]{color:#f59e0b}

.tetris-wrap{display:flex;gap:20px;padding:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.tetris-cv{background:#0c0c14;border:1px solid var(--stroke);border-radius:10px;display:block}
.tetris-side{display:flex;flex-direction:column;gap:14px;min-width:130px}
.tetris-side h4{font-size:10.5px;letter-spacing:1.8px;color:var(--dim);text-transform:uppercase}
.tetris-side .val{font-size:22px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.tetris-next,.tetris-hold{background:#0c0c14;border:1px solid var(--stroke);border-radius:10px;display:block;padding:6px}
.tetris-keys{font-size:11px;color:#888;line-height:1.9}

.sudoku-wrap{padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.sudoku-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:rgba(255,255,255,.12);padding:4px;border-radius:10px;width:min(470px,86vw);height:min(470px,86vw);border:2px solid rgba(255,255,255,.25)}
.sudoku-cell{border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.6vw,20px);font-weight:600;color:#5b8cff;cursor:pointer;user-select:none}
.sudoku-cell.given{color:#fff;background:rgba(255,255,255,.10)}
.sudoku-cell.selected{background:rgba(91,140,255,.4)!important;box-shadow:inset 0 0 0 2px var(--accent)}
.sudoku-cell.error{color:#ff5f57}
.sudoku-cell.highlight{background:rgba(91,140,255,.12)}
.sudoku-cell.box-right{border-right:2px solid rgba(255,255,255,.28)}
.sudoku-cell.box-bottom{border-bottom:2px solid rgba(255,255,255,.28)}
.sudoku-pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(470px,86vw)}
.sudoku-pad button{padding:12px 6px;border-radius:9px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:#fff;font-size:15px;font-weight:600}
.sudoku-pad button:hover{background:rgba(255,255,255,.14)}

.brk-cv{background:#0c0c14;border:1px solid var(--stroke);border-radius:10px;max-width:100%;height:auto;display:block}

.sw-wrap{padding:24px;display:flex;flex-direction:column;align-items:center;gap:20px;height:100%}
.sw-display{font-size:64px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.sw-ms{font-size:32px;color:#888}
.sw-controls{display:flex;gap:10px}
.sw-controls button{padding:14px 28px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.07);color:#eee;font-size:14px;font-weight:600}
.sw-controls button.primary{background:var(--accent);border-color:transparent}
.sw-laps{width:100%;max-width:400px;max-height:200px;overflow:auto;background:rgba(0,0,0,.3);border-radius:12px;padding:10px;margin-top:10px}
.sw-lap{display:flex;justify-content:space-between;padding:6px 10px;font-size:13px;border-bottom:1px solid var(--stroke);font-variant-numeric:tabular-nums}

.stocks{padding:20px;height:100%;overflow:auto}
.stock-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:8px;border:1px solid var(--stroke)}
.stock-sym{font-size:15px;font-weight:700;min-width:70px;color:var(--accent)}
.stock-name{flex:1;font-size:12.5px;color:#ccc}
.stock-price{font-size:16px;font-weight:600;min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.stock-change{font-size:12px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.stock-change.up{color:#22c55e}
.stock-change.down{color:#ff5f57}

.cam{display:flex;flex-direction:column;height:100%;background:#000}
.cam-view{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.cam-view video{max-width:100%;max-height:100%;transform:scaleX(-1)}
.cam-controls{padding:12px;display:flex;justify-content:center;gap:10px;background:rgba(0,0,0,.6);flex-shrink:0;flex-wrap:wrap}
.cam-controls button{padding:12px 22px;border-radius:10px;border:1px solid var(--stroke);background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.cam-controls button.alt{background:rgba(255,255,255,.1)}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .1s;z-index:10}

<script>
/* ═══════════════════════════════════════════════════════════════
   MID OS v1.1  —  GRID-BASED DESKTOP ICONS (LOCKED)
   ═══════════════════════════════════════════════════════════════ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = (a,b) => a + Math.random()*(b-a);

const store = {
  get(k,d){ try{ const v = localStorage.getItem('midos11.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('midos11.'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ localStorage.removeItem('midos11.'+k); }
};

function toast(msg, sub=''){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div><b>${esc(msg)}</b>${sub?`<span>${esc(sub)}</span>`:''}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(()=>el.remove(), 300); }, 3400);
}

/* ═══ EMOJI-ONLY ICONS ═══ */
const EMOJI = {
  files:'📁', notes:'📝', calc:'🧮', terminal:'⌨️', browser:'🌐',
  settings:'⚙️', paint:'🎨', music:'🎵', clock:'🕐', mines:'💣',

function defaultFS(){

      'welcome.txt': { type:'file', content:

let FS = null;
function loadFS(){
  const k = fsKey();
  let fs = store.get(k, null);
  if(!fs){ fs = defaultFS(); store.set(k, fs); }
  return fs;
}
function saveFS(){ if(FS) store.set(fsKey(), FS); }
function getNode(path){
  if(!FS) return null;
  const parts = String(path).split('/').filter(Boolean);
  let n = FS;
  for(const p of parts){ if(!n.children || !n.children[p]) return null; n = n.children[p]; }
  return n;
}
function resolvePath(cwd, p){
  const base = String(p).startsWith('/') ? [] : cwd.split('/').filter(Boolean);
  for(const part of String(p).split('/')){
    if(part===''||part==='.') continue;
    if(part==='..') base.pop(); else base.push(part);
  }
  return '/'+base.join('/');
}
function parentPath(path){ const p = path.split('/').filter(Boolean); p.pop(); return '/'+p.join('/'); }
function baseName(path){ const p = path.split('/').filter(Boolean); return p[p.length-1] || '/'; }
function uniqueName(dirPath, name){
  const dir = getNode(dirPath);
  if(!dir || !dir.children || !dir.children[name]) return name;
  const dot = name.lastIndexOf('.');
  const stem = dot>0 ? name.slice(0,dot) : name;
  const ext  = dot>0 ? name.slice(dot) : '';
  let i=1; while(dir.children[stem+' ('+i+')'+ext]) i++;
  return stem+' ('+i+')'+ext;
}

/* Music DB */
let musicDB = null;
function openMusicDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('midos-music-v11', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('tracks'))
        db.createObjectStore('tracks', { keyPath:'id', autoIncrement:true });
    };
    req.onsuccess = e => { musicDB = e.target.result; resolve(musicDB); };
    req.onerror = e => reject(e);
  });
}
function dbAdd(file){
  return new Promise((resolve, reject) => {
    const tx = musicDB.transaction('tracks', 'readwrite');
    const req = tx.objectStore('tracks').add({ name: file.name, type: file.type, blob: file, added: Date.now() });
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}
function dbAll(){
  return new Promise((resolve, reject) => {
    const tx = musicDB.transaction('tracks', 'readonly');
    const req = tx.objectStore('tracks').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = reject;
  });
}
function dbDelete(id){
  return new Promise((resolve, reject) => {
    const tx = musicDB.transaction('tracks', 'readwrite');
    const req = tx.objectStore('tracks').delete(id);
    req.onsuccess = () => resolve();
    req.onerror = reject;
  });
}

    }));

      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);

let AC = null;
function blip(freq=660, dur=0.05, type='sine', vol=0.045){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}

let zTop = 100, winSeq = 0;
const openWindows = new Map();
const setActiveWindow = t => $('#mb-active').textContent = t || 'Desktop';
const snapPreview = $('#snapPreview');
let currentSnap = null;

function focusWin(el){
  if(!el) return;
  el.style.zIndex = ++zTop;
  $$('.window').forEach(w => w.classList.remove('focused'));
  el.classList.add('focused');
  $$('.task').forEach(t => t.classList.remove('active'));

function createWindow({ title, icon='file', width=740, height=490, x, y, appId='app' }){
  const id = 'w' + (++winSeq);
  const el = document.createElement('div');
  el.className = 'window focused';
  el.dataset.win = id;
  if(viewMode === 'mobile'){
    el.style.cssText += 'left:0;top:32px;width:100vw;height:calc(100vh - 98px)';
  } else {
    const W = Math.min(width, innerWidth - 30);
    const H = Math.min(height, innerHeight - 110);
    el.style.width = W + 'px'; el.style.height = H + 'px';
    const maxX = Math.max(10, innerWidth - W - 20);
    const maxY = Math.max(40, innerHeight - H - 90);
    el.style.left = (x ?? rand(40, 40 + maxX*0.6)) + 'px';
    el.style.top  = (y ?? rand(44, 44 + maxY*0.6)) + 'px';
  }
  el.style.zIndex = ++zTop;
  el.innerHTML = `
    <div class="titlebar">
      <div class="lights">
        <span class="light close"><span>✕</span></span>
        <span class="light min"><span>−</span></span>
        <span class="light max"><span>□</span></span>
      </div>
      <div class="wtitle">${icoHTML(appId, 18)}<span>${esc(title)}</span></div>
    </div>
    <div class="wbody"></div>
    <div class="resizer"></div>`;
  document.body.appendChild(el);
  const body = el.querySelector('.wbody');
  const rec = { el, body, title, icon, appId, minimized:false, maximized:false };
  openWindows.set(id, rec);
  el.querySelector('.light.close').addEventListener('click', e => { e.stopPropagation(); closeWin(id); });
  el.querySelector('.light.min').addEventListener('click', e => { e.stopPropagation(); minimizeWin(id); });
  el.querySelector('.light.max').addEventListener('click', e => { e.stopPropagation(); toggleMax(id); });
  el.addEventListener('mousedown', () => focusWin(el), true);
  if(viewMode !== 'mobile'){
    const bar = el.querySelector('.titlebar');
    let drag = null;
    bar.addEventListener('mousedown', e => {
      if(e.target.closest('.light')) return;
      e.preventDefault();
      focusWin(el);
      const wasMax = el.classList.contains('maximized');
      const restore = wasMax ? (rec.restore || {}) : null;
      if(wasMax){
        el.classList.remove('maximized');
        el.style.left = restore.left || '100px';
        el.style.top = restore.top || '60px';
        el.style.width = (parseInt(restore.width)||700) + 'px';
        el.style.height = (parseInt(restore.height)||460) + 'px';
        rec.maximized = false;
      }
      drag = { sx:e.clientX, sy:e.clientY, sl:el.offsetLeft, st:el.offsetTop };
      el.classList.add('dragging');
    });
    function onMove(e){
      if(!drag) return;
      let nl = drag.sl + (e.clientX - drag.sx), nt = drag.st + (e.clientY - drag.sy);
      nl = Math.max(-el.offsetWidth + 100, Math.min(innerWidth - 100, nl));
      nt = Math.max(30, Math.min(innerHeight - 90, nt));
      el.style.left = nl + 'px'; el.style.top = nt + 'px';
      const zone = 24;
      let snap = null;
      if(e.clientY <= 34) snap = 'max';
      else if(e.clientX <= zone && e.clientY <= zone) snap = 'tl';
      else if(e.clientX >= innerWidth - zone && e.clientY <= zone) snap = 'tr';
      else if(e.clientX <= zone && e.clientY >= innerHeight - zone) snap = 'bl';
      else if(e.clientX >= innerWidth - zone && e.clientY >= innerHeight - zone) snap = 'br';
      else if(e.clientX <= zone) snap = 'left';
      else if(e.clientX >= innerWidth - zone) snap = 'right';
      if(snap !== currentSnap){
        currentSnap = snap;
        if(snap){
          snapPreview.classList.add('on');
          if(snap === 'max'){ snapPreview.style.cssText='left:0;top:30px;width:100vw;height:calc(100vh - 84px)'; }
          else if(snap === 'left'){ snapPreview.style.cssText='left:0;top:30px;width:50vw;height:calc(100vh - 84px)'; }
          else if(snap === 'right'){ snapPreview.style.cssText='left:50vw;top:30px;width:50vw;height:calc(100vh - 84px)'; }
          else if(snap === 'tl'){ snapPreview.style.cssText='left:0;top:30px;width:50vw;height:calc((100vh - 84px)/2)'; }
          else if(snap === 'tr'){ snapPreview.style.cssText='left:50vw;top:30px;width:50vw;height:calc((100vh - 84px)/2)'; }
          else if(snap === 'bl'){ snapPreview.style.cssText='left:0;top:calc(30px + (100vh - 84px)/2);width:50vw;height:calc((100vh - 84px)/2)'; }
          else if(snap === 'br'){ snapPreview.style.cssText='left:50vw;top:calc(30px + (100vh - 84px)/2);width:50vw;height:calc((100vh - 84px)/2)'; }
        } else snapPreview.classList.remove('on');
      }
    }
    function onUp(){
      if(!drag) return;
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      drag = null;
      if(currentSnap){
        snapPreview.classList.remove('on');
        const snap = currentSnap; currentSnap = null;
        if(!rec.maximized) rec.restore = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height };
        el.classList.add('snapping');
        if(snap === 'max'){ el.classList.add('maximized'); el.style.cssText += 'left:0;top:30px;width:100vw;height:calc(100vh - 84px)'; rec.maximized = true; }
        else if(snap === 'left'){ el.classList.remove('maximized'); el.style.cssText += 'left:0;top:30px;width:50vw;height:calc(100vh - 84px)'; }
        else if(snap === 'right'){ el.classList.remove('maximized'); el.style.cssText += 'left:50vw;top:30px;width:50vw;height:calc(100vh - 84px)'; }
        else if(snap === 'tl'){ el.classList.remove('maximized'); el.style.cssText += 'left:0;top:30px;width:50vw;height:calc((100vh - 84px)/2)'; }
        else if(snap === 'tr'){ el.classList.remove('maximized'); el.style.cssText += 'left:50vw;top:30px;width:50vw;height:calc((100vh - 84px)/2)'; }
        else if(snap === 'bl'){ el.classList.remove('maximized'); el.style.cssText += 'left:0;top:calc(30px + (100vh - 84px)/2);width:50vw;height:calc((100vh - 84px)/2)'; }
        else if(snap === 'br'){ el.classList.remove('maximized'); el.style.cssText += 'left:50vw;top:calc(30px + (100vh - 84px)/2);width:50vw;height:calc((100vh - 84px)/2)'; }
        setTimeout(() => el.classList.remove('snapping'), 260);
      }
    }
    document.addEventListener('mousemove', e => { if(drag) onMove(e); });
    document.addEventListener('mouseup', () => { if(drag) onUp(); });
    bar.addEventListener('dblclick', e => { if(!e.target.closest('.light')) toggleMax(id); });
    el.querySelector('.resizer').addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation(); focusWin(el);
      const sx=e.clientX, sy=e.clientY, sw=el.offsetWidth, sh=el.offsetHeight;
      if(el.classList.contains('maximized')) el.classList.remove('maximized');
      const move = ev => {
        el.style.width = Math.max(340, sw + ev.clientX - sx) + 'px';
        el.style.height = Math.max(200, sh + ev.clientY - sy) + 'px';
      };
      const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  }
  addTask(id, title, icon, appId);
  focusWin(el);
  return { el, body, id };
}

function toggleMax(id){
  const w = openWindows.get(id); if(!w) return;
  if(viewMode === 'mobile') return;
  const el = w.el;
  el.classList.add('snapping');
  if(el.classList.contains('maximized')){
    el.classList.remove('maximized');
    const s = w.restore || {};
    el.style.left = s.left || '80px'; el.style.top = s.top || '60px';
    el.style.width = s.width || '700px'; el.style.height = s.height || '460px';
    w.maximized = false;
  } else {
    w.restore = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height };
    el.classList.add('maximized');
    el.style.left = '0px'; el.style.top = '30px';
    el.style.width = '100vw'; el.style.height = 'calc(100vh - 84px)';
    w.maximized = true;
  }
  setTimeout(() => el.classList.remove('snapping'), 260);
  focusWin(el);
}
function minimizeWin(id){
  const w = openWindows.get(id); if(!w) return;
  w.minimized = true; w.el.classList.add('minimizing');
  setTimeout(() => { w.el.classList.add('minimized'); w.el.classList.remove('minimizing'); }, 300);
  const t = $(`.task[data-win="${id}"]`); if(t) t.classList.remove('active');
}
function restoreWin(id){
  const w = openWindows.get(id); if(!w) return;
  w.minimized = false; w.el.classList.remove('minimized');
  focusWin(w.el);
}
function closeWin(id){
  const w = openWindows.get(id); if(!w) return;
  const cleanup = windowCleanups.get(id);
  if(cleanup){ try { cleanup(); } catch(e){} windowCleanups.delete(id); }
  w.el.classList.add('closing');
  setTimeout(() => { w.el.remove(); }, 220);
  openWindows.delete(id);
  const t = $(`.task[data-win="${id}"]`);
  if(t){ t.classList.add('removing'); setTimeout(()=>t.remove(), 220); }
  if(openWindows.size === 0) setActiveWindow('Desktop');
}
function addTask(id, title, icon, appId){
  const t = document.createElement('button');
  t.className = 'task active'; t.dataset.win = id;
  t.innerHTML = `<span class="tdot"></span>${icoHTML(appId||id, 18)}<span>${esc(title)}</span>`;
  t.onclick = () => {
    const w = openWindows.get(id); if(!w) return;
    if(w.minimized) restoreWin(id);
    else if(w.el.style.zIndex == zTop) minimizeWin(id);
    else focusWin(w.el);
  };
  $('#tasks').appendChild(t);
}

function createContextMenu(items, x, y){
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.left = Math.min(x, innerWidth - 210) + 'px';
  menu.style.top = Math.min(y, innerHeight - 60 - items.length*36) + 'px';
  menu.innerHTML = items.map((it, i) =>
    it.sep ? '<div class="ctx-sep"></div>'
    : `<div class="ctx-item" data-i="${i}">${it.label}</div>`
  ).join('');
  document.body.appendChild(menu);
  menu.querySelectorAll('.ctx-item').forEach(el => {
    el.onclick = () => {
      const it = items[+el.dataset.i];
      if(it.action) it.action();
      menu.remove();
    };
  });
  setTimeout(() => {
    const off = ev => { if(!menu.contains(ev.target)){ menu.remove(); document.removeEventListener('click', off); } };
    document.addEventListener('click', off);
  }, 30);
  return menu;
}

/* ═══════════════════════════════════════════════════════════════
   DESKTOP — GRID-BASED, LOCKED ICONS
   ═══════════════════════════════════════════════════════════════ */

const GRID_CELL_W = 110;
const GRID_CELL_H = 110;
const GRID_PAD_X = 14;
const GRID_PAD_Y = 20;

function gridSize(){
  const wrap = $('#icons');
  const w = wrap.clientWidth || (innerWidth - 20);
  const h = wrap.clientHeight || (innerHeight - 114);
  return {
    cols: Math.max(1, Math.floor((w - GRID_PAD_X*2) / GRID_CELL_W)),
    rows: Math.max(1, Math.floor((h - GRID_PAD_Y*2) / GRID_CELL_H))
  };
}
function cellToXY(col, row){
  return {
    x: GRID_PAD_X + col * GRID_CELL_W,
    y: GRID_PAD_Y + row * GRID_CELL_H
  };
}
function cellKey(col, row){ return col + ',' + row; }

/* Track which cells are occupied (current session) */
let occupiedCells = new Map(); // key -> iconId

function buildItems(){
  const items = [];
  const desktop = getNode('/Desktop');
  if(desktop){
    Object.keys(desktop.children || {}).forEach(name => {
      const n = desktop.children[name];
      items.push({ id: 'file:' + name, label: name, isDir: n.type === 'dir', name });
    });
  }
  const shortcuts = viewMode === 'mobile'
    ? [['Camera','camera'],['Terminal','terminal'],['Paint','paint'],['Midnight AI','chat'],
       ['Weather','weather'],['Tetris','tetris'],['Settings','settings'],['Files','files']]
    : [['Camera','camera'],['Tetris','tetris'],['Breakout','breakout'],
       ['Snake','snake'],['Paint','paint'],['Files','files'],
       ['Terminal','terminal'],['Browser','browser'],['Midnight AI','chat'],
       ['Settings','settings']];
  shortcuts.forEach(([n,a]) => items.push({ id: 'app:' + a, label: n, appId: a }));
  return items;
}

function renderDesktop(){
  if(!FS) return;
  const wrap = $('#icons');
  wrap.innerHTML = '';
  occupiedCells.clear();

  const items = buildItems();
  const positions = uGet('icon_positions', {}); // id -> {col,row}
  const { cols, rows } = gridSize();

  // 1) Keep saved positions that are valid & not conflicting
  const placed = new Set();
  for(const item of items){
    const p = positions[item.id];
    if(!p || typeof p.col !== 'number') continue;
    const key = cellKey(p.col, p.row);
    if(p.col < 0 || p.col >= cols || p.row < 0 || p.row >= rows) continue;
    if(occupiedCells.has(key)) continue;
    occupiedCells.set(key, item.id);
    placed.add(item.id);
  }

  // 2) Fill remaining items into free cells (row by row)
  for(const item of items){
    if(placed.has(item.id)) continue;
    let found = null;
    for(let r=0;r<rows && !found;r++){
      for(let c=0;c<cols;c++){
        const key = cellKey(c, r);
        if(!occupiedCells.has(key)){ found = {col:c, row:r, key}; break; }
      }
    }
    if(!found){ // desktop full — place at 0,0 (will overlap, that's ok)
      found = { col:0, row:0, key: cellKey(0,0) };
    }
    occupiedCells.set(found.key, item.id);
    positions[item.id] = { col: found.col, row: found.row };
  }

  uSet('icon_positions', positions);

  // 3) Build DOM
  for(const item of items){
    const pos = positions[item.id];
    const xy = cellToXY(pos.col, pos.row);
    const el = document.createElement('div');
    el.className = 'icon';
    el.dataset.iconId = item.id;
    el.dataset.col = pos.col;
    el.dataset.row = pos.row;

    if(item.appId){
      el.innerHTML = `${icoHTML(item.appId, viewMode==='mobile'?44:42)}<div class="nm">${esc(item.label)}</div>`;
    } else {
      el.innerHTML = `${icoHTML(fileIco(item.name, item.isDir), 42)}<div class="nm">${esc(item.label)}</div>`;
    }

    el.style.left = xy.x + 'px';
    el.style.top  = xy.y + 'px';

    /* open: double-click desktop, single tap on mobile */
    el.addEventListener('dblclick', e => {
      e.stopPropagation();
      openIconItem(item);
    });
    if(viewMode === 'mobile'){
      el.addEventListener('click', e => {
        e.stopPropagation();
        openIconItem(item);
      });
    }

    /* select */
    el.addEventListener('click', e => {
      e.stopPropagation();
      $$('.icon').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
    });

    /* right-click menu */
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      e.stopPropagation();
      const menuItems = [];

      menuItems.push({ label:'▶️  Open', action: () => openIconItem(item) });
      menuItems.push({ label:'✥  Move icon…', action: () => startMoveMode(el, item) });
      menuItems.push({ sep:true });

      if(item.appId){
        menuItems.push({ label:'📌  Reset position', action: () => {
          const p = uGet('icon_positions', {});
          delete p[item.id];
          uSet('icon_positions', p);
          renderDesktop();
          toast('Position reset');
        }});
      } else {
        menuItems.push({ label:'✎  Rename', action: () => {
          const nn = prompt('Rename to:', item.name);
          if(!nn || nn === item.name) return;
          const desk = getNode('/Desktop');
          desk.children[nn] = desk.children[item.name];
          delete desk.children[item.name];
          saveFS();
          const p = uGet('icon_positions', {});
          const oldPos = p['file:' + item.name];
          delete p['file:' + item.name];
          if(oldPos) p['file:' + nn] = oldPos;
          uSet('icon_positions', p);
          renderDesktop();
        }});
        menuItems.push({ label:'🗑  Delete', action: () => {
          if(!confirm('Delete "' + item.name + '"?')) return;
          delete getNode('/Desktop').children[item.name];
          saveFS();
          const p = uGet('icon_positions', {});
          delete p['file:' + item.name];
          uSet('icon_positions', p);
          renderDesktop();
        }});
      }

      createContextMenu(menuItems, e.clientX, e.clientY);
    });

    wrap.appendChild(el);
    /* NO free dragging — icons are locked to their grid cells.
       Movement only happens via the right-click "Move icon…" option. */
  }
}

function openIconItem(item){
  if(item.appId){ openApp(item.appId); return; }
  const full = '/Desktop/' + item.name;
  if(item.isDir) openApp('files', { path: full });
  else openApp('notes', { path: full });
}

/* ─── MOVE MODE: right-click → Move icon… → drag to a free cell → snaps ─── */
let moveMode = null;

function startMoveMode(el, item){
  if(moveMode) cancelMoveMode();
  moveMode = { el, item };
  el.classList.add('placing');
  document.body.style.cursor = 'crosshair';
  toast('Move mode', 'Drag the icon to a free grid cell, then release');

  const ghost = el.cloneNode(true);
  ghost.style.cssText = `
    position:fixed;pointer-events:none;z-index:99999;opacity:.7;
    width:${el.offsetWidth}px;padding:10px 4px;
    transform:translate(-50%,-50%);
    background:rgba(91,140,255,.28);
    border-radius:12px;
    display:flex;flex-direction:column;align-items:center;gap:7px;
  `;
  ghost.style.left = '50%'; ghost.style.top = '50%';
  ghost.querySelectorAll('.nm').forEach(n => n.style.color = '#fff');
  document.body.appendChild(ghost);

  let dragging = false;
  let startX = 0, startY = 0;
  const originX = parseInt(el.style.left) || 0;
  const originY = parseInt(el.style.top) || 0;

  const onMove = ev => {
    const cx = ev.clientX, cy = ev.clientY;
    ghost.style.left = cx + 'px';
    ghost.style.top = cy + 'px';

    if(!dragging){
      const dx = cx - startX, dy = cy - startY;
      if(Math.abs(dx) > 6 || Math.abs(dy) > 6) dragging = true;
    }
    if(dragging){
      const nx = originX + (cx - startX);
      const ny = originY + (cy - startY);
      el.style.left = nx + 'px';
      el.style.top  = ny + 'px';
    }
  };

  const onClick = ev => {
    ev.preventDefault();
    ev.stopPropagation();
    if(!dragging){
      cancelMoveMode();
      return;
    }

    // Snap to nearest free cell
    const { cols, rows } = gridSize();
    const cx = ev.clientX, cy = ev.clientY;
    const wrapRect = $('#icons').getBoundingClientRect();
    const lx = cx - wrapRect.left - el.offsetWidth/2;
    const ly = cy - wrapRect.top  - el.offsetHeight/2;

    const cand = [];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const key = cellKey(c, r);
      if(occupiedCells.has(key) && occupiedCells.get(key) !== item.id) continue;
      const xy = cellToXY(c, r);
      const dx = xy.x - lx, dy = xy.y - ly;
      cand.push({ col:c, row:r, dist: dx*dx + dy*dy });
    }
    if(!cand.length){ toast('No free cells'); cancelMoveMode(); return; }
    cand.sort((a,b) => a.dist - b.dist);
    const target = cand[0];

    // Unregister old cell
    const oldCol = +el.dataset.col;
    const oldRow = +el.dataset.row;
    const oldKey = cellKey(oldCol, oldRow);
    if(occupiedCells.get(oldKey) === item.id) occupiedCells.delete(oldKey);

    // Register new cell
    const newKey = cellKey(target.col, target.row);
    occupiedCells.set(newKey, item.id);

    const xy = cellToXY(target.col, target.row);
    el.style.left = xy.x + 'px';
    el.style.top  = xy.y + 'px';
    el.dataset.col = target.col;
    el.dataset.row = target.row;

    // Save
    const positions = uGet('icon_positions', {});
    positions[item.id] = { col: target.col, row: target.row };
    uSet('icon_positions', positions);

    cancelMoveMode();
    toast('Icon placed', 'Cell ' + (target.col+1) + ',' + (target.row+1));
  };

  const onKey = ev => { if(ev.key === 'Escape') cancelMoveMode(); };

  function cancelMoveMode(){
    if(!moveMode) return;
    moveMode.el.classList.remove('placing');
    document.body.style.cursor = '';
    ghost.remove();
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('click', onClick, true);
    document.removeEventListener('keydown', onKey);
    moveMode = null;
  }
  window.__cancelMoveMode = cancelMoveMode;

  document.addEventListener('mousemove', onMove);
  document.addEventListener('click', onClick, true);
  document.addEventListener('keydown', onKey);
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && moveMode && window.__cancelMoveMode){
    window.__cancelMoveMode();
  }
});

function initWidget(id, w){
  switch(id){
    case 'clock': tickSimpleClock(w); w._t = setInterval(() => { if(!document.body.contains(w)){ clearInterval(w._t); return; } tickSimpleClock(w); }, 1000); break;

    case 'weather': loadWidgetWeatherInto(w); break;
    case 'todo': renderTodoWidget(w); break;
    case 'calendar': renderCalendarWidget(w); break;
    case 'notes': initNotesWidget(w); break;
    case 'system': initSystemWidget(w); break;
    case 'quote': initQuoteWidget(w); break;
    case 'calculator': initCalcWidget(w); break;
    case 'stocks': initStocksWidget(w); break;

function tickSimpleClock(w){
  const t = w.querySelector('[data-time]'); const d = w.querySelector('[data-date]');
  const now = new Date();
  const h = ((now.getHours() + 11) % 12) + 1;
  if(t) t.textContent = `${h}:${String(now.getMinutes()).padStart(2,'0')} ${now.getHours() < 12 ? 'AM' : 'PM'}`;
  if(d) d.textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
}
function tickBigClock(w){
  const t = w.querySelector('[data-bigtime]'); const d = w.querySelector('[data-date]');
  const now = new Date();
  if(t) t.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  if(d) d.textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}

function renderCalendarWidget(w){
  const el = w.querySelector('[data-cal]');
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const days = ['S','M','T','W','T','F','S'];
  const first = new Date(y, m, 1).getDay();
  const total = new Date(y, m+1, 0).getDate();
  let html = '';
  days.forEach(d => html += `<div class="dn">${d}</div>`);
  for(let i = 0; i < first; i++) html += '<div></div>';
  for(let d = 1; d <= total; d++) html += `<div class="dc ${d === now.getDate() ? 'today' : ''}">${d}</div>`;
  el.innerHTML = html;

function initSystemWidget(w){

    try{ if(performance.memory) memPct = Math.round((performance.memory.usedJSHeapSize / performance.memory.jsHeapSizeLimit) * 100); }catch(e){}

    el.innerHTML = `
      <div><div class="wg-sys-row"><span>Memory</span><span>${memPct}%</span></div><div class="wg-bar"><div class="wg-bar-fill" style="width:${memPct}%;background:${memPct > 80 ? '#ef4444' : memPct > 50 ? '#f59e0b' : '#22c55e'}"></div></div></div>

      <div class="wg-sys-row"><span>Connection</span><span>${connType}</span></div>`;
  }
  draw();
  w._t = setInterval(() => { if(!document.body.contains(w)){ clearInterval(w._t); return; } draw(); }, 2000);

function initCalcWidget(w){
  const input = w.querySelector('[data-calc-in]');
  let expr = '';
  w.querySelector('.wg-calc-pad').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const k = b.dataset.k;
    if(k === 'C') expr = '';
    else if(k === '='){
      try{
        const s = expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
        if(!/^[0-9+\-*/().\s]+$/.test(s)) throw new Error();
        expr = String(Math.round(Function('"use strict";return (' + s + ')')() * 1e10) / 1e10);
      }catch(err){ expr = 'Error'; }
    }
    else if(k === '.'){
      const parts = expr.split(/[+\-*/()]/);
      if(!parts[parts.length-1].includes('.')) expr += '.';
    }
    else expr += k;
    input.value = expr || '0';
  };
}
function initStocksWidget(w){
  const el = w.querySelector('[data-stocks]');
  const SYMS = [{ sym:'AAPL', price: 178, change: 0 }, { sym:'GOOGL', price: 141, change: 0 }, { sym:'MSFT', price: 378, change: 0 }, { sym:'TSLA', price: 245, change: 0 }];
  function draw(){
    el.innerHTML = SYMS.map(s => `<div class="wg-stock"><span class="wg-stock-sym">${s.sym}</span><span>$${s.price.toFixed(2)}</span><span class="wg-stock-change ${s.change >= 0 ? 'up' : 'down'}">${s.change >= 0 ? '▲' : '▼'} ${Math.abs(s.change).toFixed(2)}%</span></div>`).join('');
  }
  draw();
  w._t = setInterval(() => {
    if(!document.body.contains(w)){ clearInterval(w._t); return; }
    SYMS.forEach(s => {
      const old = s.price;
      s.price = Math.max(10, s.price + (Math.random() - 0.48) * 3);
      s.change = ((s.price - old) / old) * 100;
    });
    draw();
  }, 3000);
}
function removeWidget(id){
  const active = getActiveWidgets().filter(w => w !== id);
  uSet('active_widgets', active);
  renderWidgets();
  toast('Widget removed');
}
function makeWidgetDraggable(w){
  let dragging = false;
  w.addEventListener('mousedown', e => {
    if(e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('select')) return;
    dragging = true;
    const rect = w.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const ox = rect.left, oy = rect.top;
    w.style.position = 'fixed';
    w.style.left = ox + 'px'; w.style.top = oy + 'px';
    w.style.right = 'auto';
    w.classList.add('dragging');
    e.preventDefault();
    const onMove = ev => { if(!dragging) return; w.style.left = (ox + ev.clientX - sx) + 'px'; w.style.top = (oy + ev.clientY - sy) + 'px'; };
    const onUp = () => {
      dragging = false;
      w.classList.remove('dragging');
      const r = w.getBoundingClientRect();
      const positions = uGet('widget_positions', {});
      positions[w.dataset.widget] = { x: r.left, y: r.top };
      uSet('widget_positions', positions);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

let weatherCache = null, weatherCacheTime = 0;
async function fetchRealWeather(lat, lon){
  const now = Date.now();
  if(weatherCache && now - weatherCacheTime < 10 * 60 * 1000) return weatherCache;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,pressure_msl,uv_index&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Weather fetch failed');
  const data = await res.json();
  weatherCache = data; weatherCacheTime = now;
  return data;
}
