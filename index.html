    d.className = 'sw' + (c === uGet('accent', '#5b8cff') ? ' active' : '');
    d.style.background = c;
    d.onclick = () => { setAccent(c); [...sw.children].forEach(x => x.classList.remove('active')); d.classList.add('active'); };
    sw.appendChild(d);
  });

  function renderAppList(){
    const list = body.querySelector('#applist');
    const apps = uGet('webapps', []);
    if(!apps.length){ list.innerHTML = '<div style="color:#777;font-size:12.5px">No web apps imported yet.</div>'; return; }
    list.innerHTML = apps.map(w => `<div class="approw"><div class="grow"><div>${esc(w.name)}</div><div class="u">${esc(w.url)}</div></div><button data-id="${w.id}">Remove</button></div>`).join('');
    list.querySelectorAll('button[data-id]').forEach(b => {
      b.onclick = () => {
        const a = uGet('webapps', []).filter(x => x.id !== b.dataset.id);
        uSet('webapps', a); renderAppList(); renderDesktop(); renderStartMenu();
      };
    });
  }
  renderAppList();
  body.querySelector('#add-web').onclick = openWebAppDialog;

  body.querySelector('#reset-fs').onclick = () => { if(!confirm("Erase this user's files?")) return; store.del(fsKey()); FS = loadFS(); renderDesktop(); toast('Files reset'); };
  body.querySelector('#reset-all').onclick = () => { if(!confirm('Erase EVERYTHING?')) return; Object.keys(localStorage).filter(k => k.startsWith('midos11.')).forEach(k => localStorage.removeItem(k)); location.reload(); };
}

/* WEB APP */
function openWebAppDialog(){ $('#modal').classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); }
function addWebApp(){
  const name = $('#wa-name').value.trim();
  let url = $('#wa-url').value.trim();
  if(!name || !url){ toast('Missing fields'); return; }
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const apps = uGet('webapps', []);
  apps.push({ id:'web_' + Date.now().toString(36), name, url });
  uSet('webapps', apps);
  $('#wa-name').value = ''; $('#wa-url').value = '';
  closeModal(); renderDesktop(); renderStartMenu();
  toast('Web app added', name);
}
$('#modal').addEventListener('mousedown', e => { if(e.target.id === 'modal') closeModal(); });

/* POWER */
function togglePower(e){ if(e && e.stopPropagation) e.stopPropagation(); const open = $('#powermenu').classList.contains('open'); closeStart(); $('#powermenu').classList.toggle('open', !open); }
function closePower(){ $('#powermenu').classList.remove('open'); }
function doShutdown(){ closePower(); closeStart(); $('#shutmsg').textContent = 'Shutting down…'; $('#shutdown').classList.add('open'); setTimeout(() => { $('#shutdown').innerHTML = `<div class="msg" style="color:#888">It is now safe to close this tab.</div><button class="btn primary" onclick="location.reload()" style="margin-top:8px">Power On</button>`; }, 2200); }
function doRestart(){ closePower(); closeStart(); $('#shutmsg').textContent = 'Restarting…'; $('#shutdown').classList.add('open'); setTimeout(() => location.reload(), 1400); }
function doSleep(){ closePower(); const ov = document.createElement('div'); ov.style.cssText = 'position:fixed;inset:0;background:#000;z-index:99999;opacity:0;transition:opacity .6s'; document.body.appendChild(ov); requestAnimationFrame(() => ov.style.opacity = '1'); const wake = () => { ov.style.opacity = '0'; setTimeout(() => ov.remove(), 650); document.removeEventListener('mousedown', wake); document.removeEventListener('touchstart', wake); }; setTimeout(() => { document.addEventListener('mousedown', wake); document.addEventListener('touchstart', wake); }, 700); }

/* USER MENU */
function openUserMenu(){
  const menu = document.createElement('div');
  menu.style.cssText = 'position:fixed;top:34px;right:12px;background:var(--win);backdrop-filter:blur(30px);border:1px solid var(--stroke);border-radius:14px;padding:8px;z-index:9700;min-width:220px;box-shadow:0 24px 60px rgba(0,0,0,.7)';
  menu.innerHTML = `<div class="pm-row" style="cursor:default"><div><b>${esc(currentUser ? currentUser.displayName : 'Guest')}</b><br><span style="color:#888;font-size:11px">${esc(currentUser ? currentUser.username : '')}</span></div></div><div style="height:1px;background:var(--stroke);margin:6px 4px"></div><div class="pm-row" id="um-settings">⚙️ Settings</div><div class="pm-row" id="um-lock">🔒 Lock</div><div class="pm-row" id="um-logout">🚪 Log Out</div><div class="pm-row danger" id="um-shutdown">⏻ Shut Down</div>`;
  document.body.appendChild(menu);
  const close = () => menu.remove();
  menu.querySelector('#um-settings').onclick = () => { close(); openApp('settings'); };
  menu.querySelector('#um-lock').onclick = () => { close(); lockScreen(); };
  menu.querySelector('#um-logout').onclick = () => { close(); logOut(); };
  menu.querySelector('#um-shutdown').onclick = () => { close(); doShutdown(); };
  setTimeout(() => { const off = ev => { if(!menu.contains(ev.target)){ close(); document.removeEventListener('click', off); } }; document.addEventListener('click', off); }, 50);
}

/* LOCK */
function renderLockUsers(){
  const wrap = $('#lock-users'); wrap.innerHTML = '';
  USERS.forEach(u => {
    const el = document.createElement('div');
    el.className = 'lock-user';
    el.innerHTML = `<div class="lock-avatar">${esc(u.displayName.charAt(0).toUpperCase())}</div><div class="lock-name">${esc(u.displayName)}</div>`;
    el.onclick = () => startLogin(u);
    wrap.appendChild(el);
  });
}
function tickLockClock(){
  const t = $('#lock-time'), d = $('#lock-date');
  if(!t) return;
  const now = new Date();
  const h = ((now.getHours() + 11) % 12) + 1;
  t.textContent = `${h}:${String(now.getMinutes()).padStart(2,'0')}`;
  d.textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}
let pendingUser = null;
function showLockScreen(){ $('#lockscreen').classList.remove('hidden'); $('#loginpanel').classList.add('hidden'); renderLockUsers(); tickLockClock(); }
function lockScreen(){ $('#menubar').style.display = 'none'; $('#taskbar').style.display = 'none'; $('#startmenu').classList.remove('open'); $('#powermenu').classList.remove('open'); showLockScreen(); }
function startLogin(u){
  pendingUser = u;
  if(!u.password){ doLogin(u); return; }
  $('#login-avatar').textContent = u.displayName.charAt(0).toUpperCase();
  $('#login-name').textContent = u.displayName;
  $('#login-err').textContent = '';
  $('#login-pass').value = '';
  $('#lockscreen').classList.add('hidden');
  $('#loginpanel').classList.remove('hidden');
  setTimeout(() => $('#login-pass').focus(), 100);
}
function doLogin(u){
  currentUser = u;
  viewMode = uGet('viewMode', 'desktop');
  FS = loadFS();
  applyWallpaper(uGet('wallpaper', WALLPAPERS[0]));
  setAccent(uGet('accent', '#5b8cff'));
  $('#lockscreen').classList.add('hidden');
  $('#loginpanel').classList.add('hidden');
  $('#menubar').style.display = '';
  $('#taskbar').style.display = '';
  $('#mb-user-av').textContent = u.displayName.charAt(0).toUpperCase();
  $('#mb-user-name').textContent = u.displayName;
  applyViewMode(viewMode, true);
  renderDesktop();
  renderStartMenu();
  renderWidgets();
}
$('#login-go').onclick = () => { if(!pendingUser) return; const p = $('#login-pass').value; if(p === pendingUser.password) doLogin(pendingUser); else { $('#login-err').textContent = 'Incorrect password'; $('#login-pass').value = ''; $('#login-pass').focus(); } };
$('#login-pass').onkeydown = e => { if(e.key === 'Enter') $('#login-go').click(); };
$('#login-back').onclick = () => { pendingUser = null; $('#loginpanel').classList.add('hidden'); showLockScreen(); };
function logOut(){
  closePower(); closeStart();
  currentUser = null; FS = null;
  $$('.window').forEach(w => w.remove());
  openWindows.clear();
  $$('.task').forEach(t => t.remove());
  $('#menubar').style.display = 'none';
  $('#taskbar').style.display = 'none';
  showLockScreen();
}

/* CLOCK */
function tick(){
  const d = new Date();
  const h = d.getHours(), h12 = ((h+11)%12)+1, ampm = h<12?'AM':'PM';
  $('#clock').textContent = d.toLocaleDateString(undefined, { weekday:'short' }) + '  ' + h12 + ':' + String(d.getMinutes()).padStart(2,'0') + ' ' + ampm;
}
setInterval(() => { tick(); tickLockClock(); }, 1000);

/* GLOBAL CLICKS */
document.addEventListener('click', e => {
  if(!e.target.closest('#startmenu') && !e.target.closest('#startbtn')) closeStart();
  if(!e.target.closest('#powermenu') && !e.target.closest('.tray')) closePower();
});

/* KEYBOARD */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); closeStart(); closePower(); }
  if(!currentUser) return;
  if(e.ctrlKey && e.code === 'Space'){ e.preventDefault(); openStart(); }
  if(e.ctrlKey && e.key.toLowerCase() === 't'){ e.preventDefault(); openApp('terminal'); }
  if(e.ctrlKey && e.key.toLowerCase() === 'e'){ e.preventDefault(); openApp('files'); }
  if(e.ctrlKey && e.key.toLowerCase() === 'l'){ e.preventDefault(); lockScreen(); }
});

window.addEventListener('resize', () => {
  openWindows.forEach(w => {
    if(w.el.classList.contains('maximized') && viewMode !== 'mobile'){
      w.el.style.width = '100vw';
      w.el.style.height = 'calc(100vh - 84px)';
    }
  });
});

/* BOOT */
document.body.classList.remove('hidden');
openMusicDB().catch(() => {});
setTimeout(() => {
  $('#boot').classList.add('hide');
  setTimeout(() => {
    $('#boot').style.display = 'none';
    showLockScreen();
  }, 800);
}, 2200);
</script>
</body>
</html>
